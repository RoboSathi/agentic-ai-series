[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-harness-core"
version = "0.1.0"
description = "Agentic AI Systems Masterclass - core harness"
requires-python = ">=3.11"
authors = [{name = "Karan", email = "kk.engineer@gmail.com"}]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "textual>=0.37",
    "langgraph>=0.1",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.1",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "pyyaml>=6.0",
    # Hosted encoders (NLI, cross-encoder reranking) speak plain HTTP
    # rather than the OpenAI protocol, so they need their own client.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.1",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yaml.example", "*.sql", "*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
    "live_llm: hits a real LLM endpoint; skipped unless RUN_LIVE_LLM_TESTS=1 and credentials are present",
]

[tool.coverage.run]
source = ["src", "design_patterns", "episodes"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.$",
]
fail_under = 80

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]
