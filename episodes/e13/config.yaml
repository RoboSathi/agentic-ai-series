# E13 — Memory Architecture: Working, Semantic, Episodic, Procedural.
#
# All four CoALA stores are live, and the write pipeline that decides
# which store a fact belongs in. Everything this episode is not about is
# switched off, so the trace reads as a memory trace.
#
# Note: episodes share the agent's demo database. `make dummy-data`
# resets it between takes.

episode:
  title: "Memory Architecture: Working, Semantic, Episodic, Procedural"
  principle: >-
    Which store a fact belongs in is a decision about the fact's nature,
    not about the storage engine that was convenient.
  turns:
    - "my code is 2HEDZTV"
    # A preference: generally true about this customer, so semantic.
    - "I prefer email updates, please never call me"
    # An order lookup: what happened, so episodic — and it puts a fact in
    # working memory that the last turn depends on.
    - "what is the status of order 10744?"
    # Nothing in this sentence names the order. It is answerable only if
    # the previous turn is still in working memory.
    - "and was that one delivered on time?"
    # Reads back what the write pipeline decided to keep.
    - "what do you know about how I like to be contacted?"

memory:
  enabled: true
  working:
    enabled: true
  episodic:
    enabled: true
  semantic:
    enabled: true
  procedural:
    enabled: true
  write_pipeline:
    enabled: true

context:
  enabled: true

# Off for this episode. The security suite has its own module (M13) and
# grounding has its own (M11); narrating them here would bury the memory
# steps this episode exists to show.
security:
  prompt_injection:
    enabled: false
  content_moderation:
    enabled: false
hallucination_protection:
  enabled: false
guardrails:
  enabled: false
