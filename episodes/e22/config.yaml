# E22 — Tool Selection at Scale.
#
# Tool selection is the subject, so it is the thing left on. The episode
# contrasts the agent with retrieval-based selection against the same
# agent without it, by flipping `tools.enabled` at runtime — which the
# FeatureToggle supports precisely so a control can be demonstrated
# being absent.
#
# Note: episodes share the agent's demo database. `make dummy-data`
# resets it between takes.

episode:
  title: "Tool Selection at Scale: Registry, Namespacing & Retrieval"
  principle: >-
    More tools is not better than fewer, well-selected ones. Choosing
    which tools to offer is a retrieval problem.
  turns:
    - "my code is 2HEDZTV"
    # A question with a clear intent, so retrieval has something to
    # narrow towards.
    - "what is the status of order 10744?"
    # A conversational message with no actionable intent. The interesting
    # behaviour is that it is offered no tools at all, rather than the
    # full set at a weak similarity score.
    - "thanks, you've been helpful"

tools:
  enabled: true
  selection_k: 5
  # The relevance floor. Below it a turn is offered no tools rather than
  # the whole registry — which is what stops a chatty message being
  # handed something that moves money.
  selection_min_score: 0.15

# Off: this episode is about the tool surface, not about memory, content
# screening or grounding.
features:
  prompt_injection: false
  content_moderation: false
  pii: true
  intent_classification: true
  hallucination_guard: false
  gatekeeper: true
  memory: false
  context:
    enabled: true
    rerank: true
    failure_detection: true

guardrails:
  enabled: false
