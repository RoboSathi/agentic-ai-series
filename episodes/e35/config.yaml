# E35 — Resilience Is a Control Plane Too.
#
# Every Nygard pattern the harness implements is on, because the episode
# is about how they compose rather than about any one of them.
#
# Note: episodes share the agent's demo database, and this episode
# *changes* it — it processes a real refund against order 10461. Run
# `make dummy-data` to reset before the next take.

episode:
  title: "Resilience Is a Control Plane Too"
  principle: >-
    Retry is not a recovery strategy. It is a resource-consuming
    hypothesis that a failure was transient, and it is only safe when the
    action being retried is idempotent.
  turns:
    - "my code is 2HEDZTV"
    # Order 10461 is cancelled, so it is settled and refundable. The
    # refund runs as a saga: validate, reserve, issue, update, notify.
    - "I'd like a refund for order 10461 please"
    # The same request again. The saga does not run twice — the
    # idempotency guard recognises the action and returns the first
    # result. This is the pairing the episode's thesis rests on.
    - "sorry, I'm not sure that went through — please refund order 10461"

# Off: not this episode's subject.
features:
  prompt_injection: false
  content_moderation: false
  pii: true
  intent_classification: true
  hallucination_guard: false
  gatekeeper: true
  memory: false
  context:
    enabled: true
    rerank: true
    failure_detection: true

guardrails:
  enabled: false
