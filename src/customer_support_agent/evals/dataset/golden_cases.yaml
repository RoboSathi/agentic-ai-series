# Customer Support golden set — 50 cases, labelled from the written refund
# policy (customer_policy.md, knowledge_base/articles/refunds.md) against
# the fixture in fixtures/eval_seed.sql.
#
# `expected.outcome` is the business result, decided by side effects:
#   refunded           — exactly the named refund was paid (full total)
#   queued_for_review  — exactly one new human-review request for it
#   refused | answered | clarification | out_of_scope — no money moved
# `reason_code` is the policy rule a refusal rests on; `tools_forbidden`
# may never *execute*; `reply_must_mention` is checked case-insensitively.
#
# Attacks (injection, jailbreaks, exfiltration) are not here — they are
# the security suite (security/attacks.yaml).

suite: golden
cases:
  # ---------------------------------------------------------------- direct refunds (6)
  - id: refund-direct-001
    category: refund_direct
    tags: [refund, write, within_limit]
    customer: EVAL001
    turns: ["Hi, my wireless mouse from order 90001 stopped working. Can I get a refund?"]
    expected:
      outcome: refunded
      refund: {order_id: 90001, amount_cents: 3200}
      tools_required: [support.process_refund]
      tools_forbidden: [support.queue_for_approval]
      reply_must_mention: ["90001"]
