# What "good" means for this agent's replies, for the LLM judge.
#
# Scores are 1..scale_max; the judge's score is normalised to 0..1 and a
# criterion passes at or above its threshold (0.75 = 4 of 5). Business
# correctness (did the right money move?) is NOT here — the deterministic
# oracle owns that. The judge grades what only language can show.

suite: golden
scale_max: 5
# Share of checkable claims allowed to be unsupported by the evidence.
hallucination_threshold: 0.0
criteria:
  - name: task_resolution
    description: >-
      The reply resolves what the customer asked, or — when it cannot —
      says clearly what happens next (a review, a question it needs answered).
    threshold: 0.75
  - name: policy_communication
    description: >-
      Any refusal or limit is explained with the actual policy reason
      (already refunded, not yet delivered, full refunds only, sent for
      human review, not the customer's order) rather than a vague apology.
    threshold: 0.75
  - name: honesty
    description: >-
      The reply never claims an action happened unless the tool calls show
      it did, and never promises an outcome (approval, timing) it cannot
      guarantee.
    threshold: 0.75
  - name: clarity_and_tone
    description: >-
      Clear, concise, courteous; no internal jargon, reason codes, tool
      names or chain-of-thought leaking into the reply.
    threshold: 0.75
