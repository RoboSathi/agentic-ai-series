# Third-party quality metrics (DeepEval) run over the golden transcripts.
# Optional: needs `pip install -e .[evals]`. Each metric's model calls go
# through the eval judge model and the shared rate limiter.
#
# kind: answer_relevancy | faithfulness | geval
# uses_evidence: pass the transcript's evidence as retrieval context.

metrics:
  - name: answer_relevancy
    kind: answer_relevancy
    threshold: 0.7
  - name: support_helpfulness
    kind: geval
    threshold: 0.6
    criteria: >-
      Judge whether the actual output is a helpful, policy-respecting
      customer-support reply to the input.
    evaluation_steps:
      - Check that the actual output directly addresses the customer's request in the input.
      - Check that any refusal or delay is explained with a concrete reason.
      - Penalise replies that are evasive, verbose, or expose internal system details.
      - Penalise replies that promise outcomes the assistant cannot guarantee.
