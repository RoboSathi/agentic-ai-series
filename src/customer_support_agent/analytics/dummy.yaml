# This agent's simulated traffic for the generated analytics world (`make dummy-data
# analytics`, platform `analytics/dummy.py`). Outcomes must be ones this agent declares
# under `analytics.tasks.outcomes` in its overlay; the generator checks.
agent_id: customer_support_agent
overlay: src/customer_support_agent/config/config.yaml
sessions_per_day: 45
tasks:
  refund:
    weight: 0.30
    turns: [1, 3]
    outcomes: {refund_issued: 0.55, refund_queued_for_review: 0.22, action_refused: 0.13, action_failed: 0.06, action_unverified: 0.04}
    open_rate: 0.08
  cancellation:
    weight: 0.12
    turns: [1, 2]
    outcomes: {order_cancelled: 0.80, action_refused: 0.12, action_failed: 0.08}
    open_rate: 0.05
  implicit:
    weight: 0.58
    turns: [1, 3]
    outcomes: {unclassified: 1.0}
steps: [1, 5]
step_cap: 5
cap_abort_rate: 0.2
roles:
  nim:
    provider: nim
    primary: nvidia/nemotron-3.5-lightning-30b-a3b
    backups: [nvidia/nemotron-3-ultra-550b-a55b, openai/gpt-oss-20b]
    latency_ms: 1800
    prompt_tokens: [1800, 5200]
    completion_tokens: [60, 420]
tool_step_rate: 0.5
tools_per_step: [1, 2]
tools:
  support.get_order_status: {weight: 0.25, duration_ms: 12}
  support.list_orders: {weight: 0.15, duration_ms: 18}
  support.get_refund_status: {weight: 0.15, duration_ms: 12}
  support.process_refund: {weight: 0.33, side_effecting: true, failure_rate: 0.04, timeout_rate: 0.01, duration_ms: 45}
  support.cancel_order: {weight: 0.12, side_effecting: true, failure_rate: 0.03, duration_ms: 40}
stage_rates: {invalid: 0.03, unknown: 0.01, not_offered: 0.02, refused: 0.07, duplicate: 0.04}
governed: true
escalate_share: 0.6
screens:
  pii: {backend: local_model, model: en_core_web_lg-3.8.0, latency_ms: 35, flag_rate: 0.18}
  injection: {backend: rule, latency_ms: 2, block_rate: 0.01}
  jailbreak: {backend: hosted_model, model: nvidia/nemoguard-jailbreak-detect, latency_ms: 420, block_rate: 0.01, failure_rate: 0.01}
  moderation: {backend: rule, latency_ms: 1, block_rate: 0.005}
  content_safety: {backend: hosted_model, model: nvidia/nemotron-3.5-content-safety, latency_ms: 520, flag_rate: 0.02, failure_rate: 0.01}
# The verification-code turn and database-answered turns are never screened.
unscreened_rate: 0.15
dependencies:
  embedding: {backend: hosted_model, model: nvidia/nemotron-3-embed-1b, latency_ms: 160, per_step: 1.5, failure_rate: 0.01}
  nli: {backend: local_model, model: cross-encoder/nli-deberta-v3-base, latency_ms: 90, per_step: 0.8}
  rerank: {backend: hosted_model, model: cross-encoder/ms-marco-MiniLM-L-6-v2, latency_ms: 210, per_step: 0.3, failure_rate: 0.02}
  intent_model: {backend: local_model, model: intent-distilbert, latency_ms: 25, per_step: 0.3}
grounding: {backend: local_model, model: cross-encoder/nli-deberta-v3-base, latency_ms: 240, claims: [1, 4], unsupported_rate: 0.05, low_confidence_rate: 0.08, writer_model: nvidia/nemotron-3.5-lightning-30b-a3b}
turn_overhead_ms: 350
# A refund queued for a person is reviewed later: this agent's own Tier-2 facts.
tier2:
  hook: customer_support_agent.analytics.dummy:reviews
  outcomes: [refund_queued_for_review]
  params:
    decisions: {approved: 0.70, denied: 0.20, failed: 0.05, pending: 0.05}
    # The decision under which the refund went through.
    issued_decision: approved
    wait_minutes: 40
