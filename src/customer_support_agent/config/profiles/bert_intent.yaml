# The intent classifier as the fine-tuned BERT instead of Laya (`make agent csa PROFILE=bert_intent`,
# and the `bert` contenders of `make intent-eval csa`). Its threshold and label mapping are
# `customer_support_agent.intent_router.classifiers.huggingface_local` in the agent's config.
llm:
  intent_classifier:
    provider: huggingface_local
