agent:
  id: customer_support_agent
  # How dashboards and reports title this agent.
  display_name: Customer Support Agent
  version: 0.1.0
  # The operator shell runs whatever host this names. The platform never
  # names an agent; the agent names itself.
  host: customer_support_agent.console:CustomerSupportHost
  # What this agent acts on, as cards name it.
  subject_fields:
    - {field: order_id, label: order, summarise: true}
    - {field: customer_id, label: customer}

# This agent's harness. Overrides the platform defaults; an episode
# overlay overrides these in turn. Everything on: a support agent that
# moves money talks to the public, so every control it could have, it has.
features:
  deterministic_checks: true
  prompt_injection: true
  content_moderation: true
  pii: true
  intent_classification: true
  # On. An agent that states an order's delivery date and a refund's
  # outcome must be checkable against what its tools actually
  # returned; without this the draft reaches the customer unread.
  hallucination_guard: true
  gatekeeper: true
  memory:
    enabled: true
    working: true
    episodic: true
    semantic: true
    procedural: true
  context:
    enabled: true
    rerank: true
    failure_detection: true

# This agent's tasks (ADR 0009 D2, D4): a refund or a cancellation, opened when the
# request is classified and closed by the write that carries it out. Every other
# turn is an implicit task. The platform adds its reserved outcomes to these.
analytics:
  tasks:
    kinds: [refund, cancellation]
    outcomes:
      refund_issued: {success: true, terminal: true}
      order_cancelled: {success: true, terminal: true}
      # The request is in a person's hands: the agent did what it should.
      refund_queued_for_review: {success: true, terminal: true}
      action_refused: {success: false, terminal: true}
      action_failed: {success: false, terminal: true}
      action_unverified: {success: false, terminal: true}

# This agent's live, in-process SLO registry (`observability/accounting.py`) observes
# these per turn; they merge with the platform's catalogue targets.
observability:
  slo_targets:
    task_success_rate: 0.95
    unauthorized_action_rate: 0.0
    escalation_rate: 0.20
    tool_failure_rate: 0.05
    recovery_success_rate: 0.90
    policy_violation_rate: 0.0
  # What the CONTEXT card calls the prompt sections only this agent's requests carry.
  context_card:
    labels:
      refund_limit: Refund limit
      intent_fallback: Intent fallback

logging:
  # This agent's own subsystem, coloured on the console beside the platform's.
  subsystem_colors:
    customer_support_agent: bright_green

# Nine things version independently (E39). These name *this* agent's
# artifacts; the platform ships neutral placeholders.
audit:
  policy_version: refund-policy-v1
  data_version: dummy-data-v1
  prompt_version: support-prompt-v2
  tool_schema_version: support-tools-v1
  prompt_source: customer_support_agent/prompts (AGENT.md + skills/)
  policy_source: gatekeeper + customer_policy.md

llm:
  intent_classifier:
    # Which model classifies a turn the phrase rules did not settle:
    #   laya_local        — Laya decision model, asked which of `intents[]` (by description)
    #   huggingface_local — the fine-tuned BERT below, through its label mapping
    # Each has its own threshold and labels in `customer_support_agent.intent_router.classifiers`.
    provider: laya_local
    # The BERT (`provider: huggingface_local`).
    model: learn-abc/magicSupport-intent-classifier
    local_model_dir: local_models/intent_classifier/magicSupport-intent-classifier
    # Laya (`provider: laya_local`): one checkpoint of a bundle, downloaded once.
    laya:
      model: convaiinnovations/laya
      subfolder: typed-decisions
      local_model_dir: local_models/intent_classifier/laya-typed-decisions
  # The memory dream (`make dream`) summarises each session with this local model.
  dialogue_summarizer:
    enabled: true
  # The local-model probe (`make model-check`) runs the intent classifier on a line of this agent's.
  check:
    local:
      intent_text: "I want a refund for my order"

# The profile and the skills (ADR 0010): synced into procedural memory
# at start-up when memory.procedural is on, selected per turn by intent.
skills:
  profile_path: src/customer_support_agent/prompts/AGENT.md
  skills_dir: src/customer_support_agent/prompts/skills
  # An unplaced turn (route llm_fallback) loads no skill unless its words match one
  # (lexical) or it nearly reached a read intent (`intent_router.suggestion`); it is offered
  # `intent_router.unknown_tools` at most, because a write needs a request the router
  # recognised as one.
  selection:
    max_active: 3
  # Profile + the three largest skills may add at most this to a prompt (the old
  # instructions were 3,167).
  max_prompt_chars: 2800

review:
  words:
    # This agent's review kinds: a refund or a cancellation's refund above its authority, and
    # a reply the hallucination check cut. The key is stored and typed; the label is shown.
    kind_labels:
      refund: refund above the limit
      cancel_and_refund: cancellation above the limit
      reply: Hallucination Check (reply truncated)
    columns:
      refund: [ID, Order, Amount, Customer, Why queued, Raised]
      cancel_and_refund: [ID, Order, Amount, Customer, Why queued, Raised]
      reply: [ID, Customer, Session, Removed sentences, Why cut, Raised]

memory:
  files:
    root: data/customer_support_agent/memory
  # Whoever a fact or session is about is a customer, here.
  subject_label: "customer {subject}"
  no_subject_label: "shared (no customer)"
  dream:
    # How this agent words a refused tool call (graph/nodes/execute.py);
    # refusals repeated across sessions become skill candidates.
    refusal_markers: ["That action was not permitted:"]
    learned_skill:
      lessons:
        refused: "'{value}' was refused in {count} {unit}. Check that condition first and tell the customer before proposing the action."
    # This agent's read-only tools: a dream summary says "looked up
    # orders …" for these and quotes only the calls that changed something.
    lookup_tools: [get_order_status, get_refund_status, list_orders]
  semantic:
    # This agent's knowledge index and the corpus that feeds it. The
    # articles explain policy; the rules themselves stay in code.
    rag:
      db_path: db/customer_support_agent/knowledge.db
      corpus_dir: src/customer_support_agent/knowledge_base/articles
  write_pipeline:
    classification_hints:
      # This agent's domain vocabulary for the deterministic first tier.
      order_fact: ["order", "tracking", "delivered", "shipment"]
      policy_limit: ["refund limit", "spending limit", "my limit is", "cap is now", "threshold is now"]

security:
  pii:
    # The tool-call fields this agent's tools actually take.
    tool_call_allowed_fields: [order_id, user_id, amount, reason, status]
    # The business's own support address, not a customer's, so it is never redacted.
    allow_list:
      - &support_contact contact@robosathi.com
    presidio:
      # A customer's name and address are personal data here, beside the platform's contact and
      # financial identifiers.
      entities: [PERSON, LOCATION, EMAIL_ADDRESS, PHONE_NUMBER, CREDIT_CARD, IBAN_CODE, IP_ADDRESS, US_SSN]
  prompt_injection:
    suspicious_phrases:
      - ignore previous instructions
      - ignore all previous
      - disregard the above
      - you are now
      - system prompt
      - new instructions
      - override your
      # This agent moves money, so a claimed limit change is an attack on it.
      - my refund limit is now

# This agent's database; every default connection pool opens it.
persistence:
  db_path: db/customer_support_agent/agent.db

guardrails:
  # The guardrail card's block reasons, in this agent's words.
  block_reasons:
    TOOL_EVIDENCE_IDENTIFIER_MISMATCH: names an order number found in no evidence
    TOOL_EVIDENCE_RECORD_STATE_MISMATCH: states a refund status the record disagrees with
    TOOL_EVIDENCE_NOT_EXECUTED: claims a refund the tool call never executed

hallucination_check:
  # This agent's sources, by name: an order's database row and the agent policy's row, the
  # session's verified facts, and the rules of the refund policy file and the system prompt.
  evidence_sources:
    prefixes:
      "order_record:": "DB record · order {id}"
      "policy:": "DB agent policy · {id}"
      "session:": "Session · {id}"
      "refund_policy#": "Refund policy file · rule {id}"
      "system_prompt#": "System prompt · rule {id}"
  # This agent's ids are five-digit order numbers (the same shape the
  # evals use). A record about another order cannot refute a claim.
  refute_identifier_pattern: '\b\d{5}\b'
  # A claim nothing grounds was made up: cut, and queued for a person like a wrong one.
  unsupported_is_hallucination: true
  # What the customer reads when nothing of a reply survived, by why. Every cut reply is
  # queued, so each says a person will follow up rather than "try again".
  withheld_replies:
    CLAIM_UNSUPPORTED: "I want to be sure I give you accurate details, so a colleague is checking my answer and will follow up shortly."
    LOW_CONFIDENCE_DEGENERATE: "Sorry, something went wrong writing that reply. A colleague is checking it and will follow up shortly."
    LOW_CONFIDENCE_SPECIFIC: "I want to be sure I give you accurate details, so a colleague is checking my answer and will follow up shortly."
    HALLUCINATION_GUARD_BLOCK: "I couldn't confirm that answer against your records, so a colleague is checking it and will follow up shortly."
  # The facts `presentation/facts.py` states, and how a claim words each. A flag's `deny`
  # is read before its `affirm`; a value is checked only when its `terms` appear.
  facts:
    state_attribute: refund_status
    attributes:
      order_status: {type: text}
      refund_status: {type: text}
      product: {type: text}
      carrier: {type: text}
      tracking_number: {type: text}
      current_location: {type: text}
      delivered_on: {type: date, terms: ['\bdeliver']}
      due_on: {type: date, terms: ['\bdue\b', '\barriv', '\bexpected\b', '\bestimated\b']}
      order_total: {type: money, terms: ['\btotal', '\bamount\b', '\bcost', '\bpaid\b', '\bprice\b', '\brefund']}
      refund_eligible:
        type: flag
        affirm: ['\beligible\s+for\s+(?:a\s+)?(?:full\s+)?refund', '\bcan\s+be\s+refunded\b', '\bqualifies\s+for\s+(?:a\s+)?refund', '\bis\s+refundable\b']
        deny: ['\bnot\s+eligible\b', '\bineligible\b', '\bcannot\s+be\s+refunded\b', '\bcan[’'']?t\s+be\s+refunded\b', '\bnot\s+(?:yet\s+)?refundable\b', '\bisn[’'']?t\s+eligible\b']
      settlement_window: {type: duration, terms: ['\bsettl']}
      # The limit is a fact the guard reads, never one a corrected reply states.
      refund_limit: {type: money, terms: ['\blimit\b', '\bdirectly\b', '\bmyself\b'], correctable: false}
      support_contact: {type: text}
      customer_name: {type: text}
      customer_id: {type: number, terms: ['\baccount\b', '\bcustomer\s+(?:id|number)\b']}
      verified: {type: flag, affirm: ['\bverified\b'], deny: ['\bnot\s+verified\b', '\bunverified\b']}
    # The limit is never written to a customer, so a reply says how an amount stands against it
    # in words. These name it; the ledger reads the figure from the fact.
    references:
      refund_limit:
        - '\bamount\s+(?:i|we)\s+can\s+(?:refund|handle|approve|issue)\b'
        - '\b(?:my|our|the)\s+(?:refund\s+)?(?:limit|authority|authori[sz]ation)\b'
        - '\b(?:i|we)\s+can\s+(?:refund|approve|issue)\s+(?:directly|myself|on\s+my\s+own)\b'
  # This agent's records: order ids, refund outcomes, and the refund state machine.
  # A claim naming one of these is about this case and needs a record.
  record_identifier_pattern: '\border\s*#?\s*\d{3,}\b'
  record_identifier_label: order
  # An outcome stated as done. With a promise marker it is a promise.
  outcome_pattern: '\b(?:refunded|queued|approved|processed|issued|completed?|settled|done|finished|submitted|denied|rejected|cancelled|canceled|delivered|shipped|pending|on\s+its\s+way|human\s+review|request\s+created|sent\s+for\s+review|referred|escalated|forwarded)\b'
  record_state_pattern: 'refund(?:_|\s+)status\s*[:=]\s*(\w+)'
  # The refund state machine. A state record ("Order N refund status: X") is
  # not something an NLI model can read: it contradicted "has been submitted"
  # against `pending_review`. So it is read here, in both directions, and is
  # never sent to NLI. `ladder` runs earliest first and each status implies
  # the earlier ones happened; `branches` names a status off the ladder and
  # how far it got before it stopped. An *event* phrase ("submitted",
  # "refunded") is true once the refund has reached its status; a *state*
  # phrase (`exact`: "pending review", "denied") is true only while it is
  # there. Event phrases win when both appear ("was queued for human review"
  # is history). A claim is judged only if it also talks about a refund
  # (`context_pattern`), so "your order has been processed" is left alone.
  record_states:
    subject: refund
    # `issued`: paid and voidable; `completed`: settled. A voided refund goes
    # back to `none`.
    ladder: [none, pending_review, issued, completed]
    branches: {denied: pending_review}
    # From this status on, money has moved or been authorised.
    settled_from: issued
    # Record wording that states a status without the status line.
    observed_as:
      none:
        - no refund has been requested
      pending_review:
        - queued for human review
        - awaiting a decision
        - awaiting human review
        - sent for review
    # "You'll hear back" names no refund, but in this agent the only person who
    # follows up is a reviewer: it promises a review, so it is judged as one. So does
    # "you'll receive an update once a decision is made" (a reviewer's decision). Not
    # "let you know", which also promises a shipment, and would be refuted with no review.
    context_pattern: '(?:\b(?:refund|request|review|amount|money|payment|funds|hear\s+back|get\s+back\s+to\s+you|follow\s+up|receive\s+an\s+update|update\s+you|keep\s+you\s+(?:posted|updated)|decision)|\$\s?\d)'
    phrases:
      - reaches: pending_review
        pattern: '\b(?:requested|submitted|received|queued|initiated|started|created|sent\s+for\s+(?:\w+\s+)?review|referred|escalated|forwarded|hear\s+back|get\s+back\s+to\s+you|follow\s+up|receive\s+an\s+update|update\s+you|keep\s+you\s+(?:posted|updated)|decision\s+(?:is|has\s+been)\s+made|once\s+a\s+decision)\b'
      - reaches: pending_review
        exact: true
        pattern: '\b(?:pending|awaiting|under\s+review|in\s+review|human\s+review|manual\s+review)\b'
      # Money has moved: true from `issued` on. A refund is approved by being issued
      # (a reviewer's approval issues it), so "approved" is the same event.
      - reaches: issued
        pattern: '\b(?:approved|refunded|processed|issued|paid|sent\s+back|paid\s+back|credited|reimbursed|returned)\b'
      # Settled: true only once the window has closed.
      - reaches: completed
        pattern: '\b(?:completed?|done|finished|settled|on\s+its\s+way)\b'
      - reaches: denied
        exact: true
        pattern: '\b(?:denied|declined|rejected)\b'
  # Where a refund goes is a rule stated once in the knowledge article; the
  # outcome around it is a fact about this case. Split, each is checked by
  # what can ground it.
  rule_phrases:
    - pattern: '\s*\bto\s+(?:your|the)\s+original\s+payment\s+method\b'
      statement: A refund goes back to the original payment method
    # The amount of a refund is a rule (policy: always the full order total), not a
    # fact about this case: carve it out, so "$21.35 was returned" is the outcome.
    - pattern: '\s*\b(?:the\s+)?full\s+(?:order\s+)?(?:amount|total)\s+of\b'
      statement: A refund is always for the full order total

gatekeeper:
  mandate:
    # This agent's writes all act on an order.
    target_param: order_id
  # No agent-wide rolling spend window. Refunds are always for an order's full
  # total, so one cannot be split, and the window was never reached in use; the
  # per-refund limit (the agent policy row) is this agent's bound.
  ledger:
    enabled: false

evals:
  plugin: customer_support_agent.evals.plugin:CsaEvalPlugin
  run_id_prefix: csa
  # Reports land in the repo's reports/ folder; Promptfoo's raw JSON is runtime data.
  reporting:
    output_dir: reports/customer_support_agent/evals
  promptfoo:
    output_dir: data/customer_support_agent/evals/promptfoo
  fingerprint:
    source_roots: [src/agent_platform, src/customer_support_agent]
    # What cannot change this agent's answers. The golden cases are not hashed here: each
    # case is hashed on its own, so editing three cases regenerates three. The fixture seed,
    # the fixture builder and the agent-under-test harness *are* hashed: they change what
    # the agent sees.
    agent_exclude_paths:
      - src/customer_support_agent/console
      - src/customer_support_agent/evals/dataset/golden_cases.yaml
      - src/customer_support_agent/evals/oracle
      - src/customer_support_agent/evals/deepeval
      - src/customer_support_agent/evals/promptfoo
      - src/customer_support_agent/evals/intent
      - src/customer_support_agent/evals/plugin.py
      - src/customer_support_agent/evals/README.md

durability:
  # This agent's checkpoints: every turn it has run, node by node.
  db_path: db/customer_support_agent/checkpoints.db

customer_support_agent:
  tasks:
    kinds:
      refund: {intent: REQUEST_REFUND, action: support.process_refund, done: refund_issued}
      cancellation: {intent: CANCEL_ORDER, action: support.cancel_order, done: order_cancelled}
    queued: refund_queued_for_review
    refused: action_refused
    failed: action_failed
    unverified: action_unverified
  # How the customer's own words name an order. One reader, used by the
  # graph, DeterministicCheck and the mandate that scopes a write, so the path that
  # answers and the path that acts cannot read one message two ways.
  order_reference:
    anchored_patterns:
      # "order 10786", "order: 10786", "this order -> 10786", "the order is 10786"
      - '\border\b(?:\W|\b(?:id|no|num|number|is|for|the|this|that)\b){0,8}?(?P<id>\d{4,})\b'
      - '\b(?P<id>\d{4,})\s+order\b'
    compact_patterns:
      # "refund 10786", "cancel order #10786"; "refund $20" is not an order.
      - '\b(?:refund|cancel)\b(?:\s+(?:for|on))?(?:\s+order)?\s*[#:]?\s*(?P<id>\d{4,})\b(?!\s*(?:dollars?|usd|\$))'
    id_shape: '\b\d{5}\b'
  # The order, the rules and the session as typed facts (`presentation/facts.py`): the
  # hallucination check reads their values before any model, and NLI reads these
  # sentences. Who the customer is comes from authentication, never from the customer.
  grounding_facts:
    statements:
      order_status: "Order {order_id} is {value}."
      product: "Order {order_id} is for {value}."
      order_total: "Order {order_id} totals {value}."
      delivered_on: "Order {order_id} was delivered on {value}."
      due_on: "Order {order_id} is due on {value}."
      carrier: "Order {order_id} is shipped by {value}."
      tracking_number: "Order {order_id} has the tracking number {value}."
      current_location: "Order {order_id} is currently at {value}."
      refund_eligible: "Order {order_id} is eligible for a refund."
      settlement_window: "An issued refund settles within {minutes} minutes."
      support_contact: "The customer can contact {value}."
      refund_limit: "A refund above {value} needs a person's review."
      customer_name: "The customer is {value}."
      customer_id: "The customer's account number is {value}."
      verified: "The customer's identity is verified."
  max_tool_iterations: 5
  # The LOOP CONTROL card is the platform's (`observability.step_events.loop_control`);
  # these are the reasons only this agent's loop has for stopping.
  loop_control_status:
    because:
      escalated: an action was handed to a person; the agent stops acting
      final_refusal: a refusal no other arguments can turn into an allow
  list_orders_max_rows: 20
  # Tool -> budget class. A tool absent from this map is not financially
  # budgeted; whether it is allowed at all is the permission check's
  # question, not the budget's.
  action_classes:
    process_refund: refund
    # A cancellation refunds the order, so it spends the same budget.
    cancel_order: refund
  intents:
  - name: ORDER_STATUS
    mode: read
    phrases:
    - where is my order
    - where is the order
    - where is order
    - what about order
    - track order
    - order status
    - has my order arrived
    - when will my order arrive
    tools:
    - get_order_status
    description: checking whether an order has shipped, arrived, or where it is
  - name: ORDER_DETAILS
    mode: read
    phrases:
    - order details
    - details of my order
    - details of the order
    - show me my order
    tools:
    - get_order_status
    description: asking for details about a specific order
  - name: LIST_ORDERS
    mode: read
    phrases:
    - what did i order
    - what have i ordered
    - order history
    - my purchases
    - delivered orders
    - cancelled orders
    - pending orders
    - shipped orders
    tools:
    - list_orders
    description: asking which orders they have, or for their orders in one state
  - name: REQUEST_REFUND
    mode: write
    phrases:
    - i want a refund
    - want a refund
    - want refund
    - request a refund
    - request refund
    - refund request
    - please refund
    - issue a refund
    - give a refund
    - refund this order
    - refund for order
    - refund
    - money back
    - reimburse
    - chargeback
    tools:
    - list_orders
    - get_order_status
    - get_refund_status
    - process_refund
    description: asking to receive a refund for an order
  # Where a refund stands — a read, answered from the record with no model
  # call. Its phrases are multi-word so they outrank REQUEST_REFUND's bare
  # "refund": "when will I get my refund" asks about one, not for one.
  - name: REFUND_STATUS
    mode: read
    phrases:
    - refund status
    - status of my refund
    - status of the refund
    - where is my refund
    - track my refund
    - track refund
    - when will i get my refund
    - when will i get the refund
    - when do i get my refund
    - what about refund
    - what about my refund
    - what about the refund
    - has my refund
    - did my refund
    - is my refund
    - didn't get my refund
    - didn't get the refund
    - didn't get refund
    - didnt get my refund
    - didnt get refund
    - didnt receive my refund
    - havent received my refund
    - did not get my refund
    - didn't receive my refund
    - did not receive my refund
    - haven't received my refund
    - have not received my refund
    - haven't got my refund
    - not received my refund
    - never got my refund
    - never received my refund
    - still no refund
    - no refund yet
    - still waiting for my refund
    - waiting for my refund
    tools:
    - get_refund_status
    description: asking where a refund stands or when it will arrive
  - name: CANCEL_ORDER
    mode: write
    phrases:
    - cancel my order
    - cancel the order
    - cancel order
    - cancel this order
    - cancel it
    - stop my order
    - i no longer want
    - don't send
    tools:
    - list_orders
    - get_order_status
    - cancel_order
    description: asking to cancel an order that has not shipped yet
  - name: UNKNOWN
    phrases: []
    tools: []
    description: a request that does not clearly fit a supported customer-support
      capability
  default_intent: UNKNOWN
  plans:
    ORDER_STATUS:
    - description: look the order up and report its state
      tool: get_order_status
    ORDER_DETAILS:
    - description: look the order up and report its details
      tool: get_order_status
    REQUEST_REFUND:
    - description: confirm the order and its current state
      tool: get_order_status
    - description: check whether the order is eligible for a refund
      tool: get_refund_status
    - description: request the refund; the result says if a person must decide
      tool: process_refund
    REFUND_STATUS:
    - description: read where the refund stands
      tool: get_refund_status
    CANCEL_ORDER:
    - description: confirm the order has not shipped and its total
      tool: get_order_status
    - description: cancel the order and refund it; the result says if a person must decide
      tool: cancel_order
    LIST_ORDERS:
    - description: list the customer's orders, filtered if they named a state
      tool: list_orders
    UNKNOWN: []
  intent_router:
    # An unplaced turn gets a skill only when it nearly reached an intent that only reads.
    suggestion:
      floor: 0.35
      margin: 0.15
    unknown_tools: [get_order_status, get_refund_status, list_orders]
    clarification_top_k: 2
    # A turn no phrase or classifier placed, that names an order the deterministic
    # checks proved is the customer's, is a question about that order: answered from
    # the record with no model call, not handed to the model as UNKNOWN.
    # A phrase counts only when asserted: "I don't want a refund" is not a refund request,
    # and "I didn't get my refund" asks where one is (REFUND_STATUS's own phrases). An
    # intent the customer refused is never granted, whatever the classifier says.
    negation:
      markers: ["don't", "dont", "do not", "didn't", "didnt", "did not", "doesn't", "does not", "won't", "wont", "will not", "haven't", "havent", "have not", "hasn't", "has not", "isn't", "is not", "not", "no", "never", "without", "can't", "cannot"]
      window_words: 4
      clause_breaks: ["but", "however", "instead", "except", "though", "although", "rather"]
      refused_reason: "The customer said they do not want {intent}."
    order_reference:
      intent: ORDER_STATUS
      source: order_reference
      reason: The turn names an order the customer owns and no other request was recognised.
    # Route a turn by `intents[].phrases` before the classifier sees it (on: a phrase
    # match is decided without a model call). Off sends every turn to the classifier
    # (profiles/no_phrase_rules.yaml). The order validator reads the same phrases
    # whatever this says.
    phrase_rules: true
    # The question a classifier that reads the intents' descriptions is asked
    # (`provider: laya_local`); the options are `intents[].description`.
    instructions: Which request is the customer making in this message?
    deterministic_rejects:
    - rule_id: WEATHER_REQUEST
      pattern: '\b(?:weather|forecast|temperature|rain(?:ing)?|snow(?:ing)?)\b'
      reason: Weather requests are outside Customer Support capabilities.
    - rule_id: POLITICAL_INFORMATION_REQUEST
      pattern: '\b(?:who\s+is\s+(?:the\s+)?(?:prime\s+minister|president|chief\s+minister))\b'
      reason: General political-information requests are outside Customer Support
        capabilities.
    - rule_id: PROGRAMMING_REQUEST
      pattern: '\b(?:write|generate|debug|fix)\s+(?:a\s+)?(?:python|javascript|java|code|program|script)\b'
      reason: Programming requests are outside Customer Support capabilities.
    # How each classifier's answers are read; the one in use is `llm.intent_classifier.provider`.
    # Thresholds differ because the scores do: the BERT's softmax runs near 1.0 even when it
    # is wrong, while Laya spreads probability over every option (intent bake-off, 2026-10-10:
    # Laya at 0.6 decided 40% of turns at 95% accuracy).
    classifiers:
      # The fine-tuned BERT answers in its own 28 labels; these are the ones that mean an
      # intent of ours. ORDER_DETAILS and LIST_ORDERS have none, so only phrases reach them.
      huggingface_local:
        confidence_threshold: 0.75
        model_label_mapping:
          ORDER_STATUS:
          - track_order
          - delivery_period
          - delivery_options
          ORDER_DETAILS: []
          LIST_ORDERS: []
          CANCEL_ORDER:
          - cancel_order
          REQUEST_REFUND:
          - get_refund
          # Tracking a refund is asking where it stands, not asking for one.
          REFUND_STATUS:
          - track_refund
          UNKNOWN:
          - fallback
          - FALLBACK
      # Laya answers in this agent's intent names (its options are `intents[].description`).
      laya_local:
        confidence_threshold: 0.6
        model_label_mapping:
          ORDER_STATUS: [ORDER_STATUS]
          ORDER_DETAILS: [ORDER_DETAILS]
          LIST_ORDERS: [LIST_ORDERS]
          REQUEST_REFUND: [REQUEST_REFUND]
          REFUND_STATUS: [REFUND_STATUS]
          CANCEL_ORDER: [CANCEL_ORDER]
          UNKNOWN: [UNKNOWN]
  followup:
    phrases:
    - what about
    - how about
    - and
    - what of
    - also
    - same for
    - check
    reference_pattern: \b\d{4,}\b
  history_turns: 6
  deliberation_markers:
  - we need to
  - we should
  - let me
  - i should
  - i need to
  - the user
  - the customer wants
  - according to policy
  - 'first, '
  - next, i
  - so the answer
  user_code_length: 7
  user_code_alphabet: ABCDEFGHJKMNPQRSTUVWXYZ23456789
  # What history, memory and logs keep in place of a typed login code. The
  # code is a credential: it is checked once and never replayed to the model.
  user_code_placeholder: "[customer code]"
  # Start-up refuses an agent database with no customers: an empty schema authenticates
  # nobody, and every code would be answered as unknown. `{path}` is the database file.
  unseeded_database: "The agent database {path} has no customers: run `make dummy-data csa`."
  stale_database: "The agent database {path} was built from an older seed_data.sql, so its customer codes are not the seed's: run `make dummy-data csa`."
  # Fixed wording the agent says itself. `{length}` is user_code_length.
  messages:
    auth:
      ask_for_code: "\nVerify your account.\nKindly enter your {length}-character user code shared over email."
      unknown_code: "\nI couldn't find an account with that code. Please check it and try again — it's the {length}-character code from your order confirmation email."
    # How far a stopped turn got, as the stop report's tree (its frame is the platform's
    # `durability.stop_report`).
    cancelled:
      labels: {request: request, customer: customer, decided: decided so far, tools: tools called}
      unverified: not verified yet
      none: nothing yet
  # The console's run controls: cancel the turn in flight, then resume it from its last
  # completed step (state persistence, idempotent replay, breaker state across a resume).
  console:
    cancel_key: ctrl+x
  # The order list, rendered from the record (never by the model) as a box table. The words are
  # what a customer reads for each state; `tui.response_highlights` colours them.
  order_table:
    headers: ["#", Order, Placed, Item, Status, Refund, Total]
    item_width: 34
    ellipsis: "…"
    status_words:
      pending: being prepared
      shipped: on its way
      delivered: delivered
      cancelled: cancelled
    refund_words:
      pending_review: awaiting review
      approved: approved
      denied: declined
      issued: issued, settling
      completed: refunded in full
    no_refund: none
    no_refund_detail: none requested
  # An order as one sentence, for the tool result and the record a reply is grounded on.
  # Each sentence is an NLI premise, so it must read as a sentence: the bare
  # "Order N: item, shipped, in transit, …" read as *contradicting* "your order
  # has already shipped". A state may use {location}, {due} and {delivered};
  # each is its `details` phrase, or empty when the record holds nothing.
  order_sentences:
    subject: "Order {order_id}"
    subject_with_item: "Order {order_id} ({description})"
    placed: "{subject} placed {placed}"
    states:
      pending: "has not shipped yet{due}"
      shipped: "has shipped and is in transit{location}{due}"
      delivered: "has shipped and was delivered{delivered}"
      cancelled: "has been cancelled, so it is not on its way"
    details:
      location: ", last seen at {value}"
      due: ", due {value}"
      delivered: " on {value}"
  demo_user_code: 43PC77U
  policy_path: src/customer_support_agent/prompts/customer_policy.md
  # The one sentence that tells the model its refund limit, rendered from the DB row
  # (`platform_agent_budgets`) when the agent is built. It is not a control and does not
  # stop the call: every refund goes through `process_refund`, so through the Gatekeeper,
  # which escalates one above the limit to the review queue. With the Gatekeeper off
  # nothing does, and the money moves.
  refund_limit_notice: >-
    You may refund at most {limit} yourself. A larger refund still goes through
    process_refund with the order's full total: the result says whether it was issued or
    sent to a person for review. Never tell the customer the amount of this limit.
  # What the dream inbox records instead of a turn's words when memory refused the claim in
  # it, or screening quarantined it: the dream's summary becomes episodic memory, and recall
  # would otherwise carry the refused words back into the model's context.
  memory_withheld: "query withheld — {reason}"
  memory_quarantined: quarantined by security screening
  # Added to the working prompt when the lightweight intent classifier could not place the
  # turn and the model routes it instead (`intent_execution_route: llm_fallback`).
  intent_fallback_instruction: >-
    # Intent fallback

    The lightweight intent classifier could not resolve this turn. Use the current
    conversation and current-turn tool results to infer what the customer means. You may
    ask a clarifying question when context is still insufficient. Never claim that a
    refund, approval, queueing, cancellation, or other business action occurred unless you
    actually call the corresponding tool and receive a successful tool result.
  # What the customer is sent instead when a reply states the limit anyway
  # (`security/limit_disclosure.py`), checked after grounding.
  refund_limit_withheld:
    with_order: "The refund for order {order_id} needs a person's review; please contact {contact}."
    without_order: "That refund needs a person's review; please contact {contact}."
  support_contact: *support_contact
  # A refund a reviewer declined is final; this is how the customer escalates it.
  refund_declined_escalation: "To escalate, email {contact}."
  # A skill's prefetch reads (ADR 0010): each tool argument, from the turn-state key that
  # holds it; a read whose required arguments are not all known is skipped, never guessed.
  # `call_id` names the tool call the model is shown, so its result pairs with it.
  prefetch:
    arguments:
      order_id: order_under_discussion
    call_id: "prefetch-{tool}"
    served_from: deterministic checks
    # The model is offered only what the turn still needs: a read prefetch already
    # answered is not offered again, and a tool whose only job is to find the order
    # is not offered once the order is known.
    needless_when_order_known: [list_orders]
  # Which turn facts become skill signals (ADR 0010): a state metadata
  # key, and how its value is written as a signal a SKILL.md trigger names.
  instruction_signals:
    intent: "intent:{value}"
    intent_execution_route: "route:{value}"
    # An unplaced turn that nearly reached a read intent carries that intent as its hint.
    intent_suggested: "intent:{value}"
  console_reviewer: console_operator
  # A refund is issued first and settles later, as a card payment does: until
  # it settles it can be voided (`/void`), after that only refunded. Settling is
  # when the customer is told the money is on its way.
  settlement:
    window_seconds: 3600
    sweep_interval_seconds: 15
    titles:
      issued: "Issued refunds — {count} voidable"
      voided: "Refund voided — order {order_id}"
      settled: "Refunds settled — {count}"
      refused: "Not voided — order {order_id}"
    headers: [Order, Amount, Settles at]
    lines:
      # Told to the customer when a refund is issued, and checked against it:
      # a sentence that names its refund, because "It settles…" was its own
      # premise and proved nothing about which refund.
      settles: "The refund of {amount} for order {order_id} has been issued and settles within {minutes} minutes"
      none_issued: Nothing issued is waiting to settle.
      voided: "The {amount} refund for order {order_id} was voided: the payment is reversed and the order is back to no refund."
      settled: "Order {order_id}: {amount} settled; the customer is notified at settlement."
      not_issued: "Order {order_id} has no issued refund to void."
      already_settled: "Order {order_id}'s refund has already settled; it can no longer be voided."
      nothing_due: Nothing was waiting to settle.
  # Why a request is queued (`hitl_queue.reason`): a refund or cancellation a person must
  # approve, or a reply the hallucination check cut — by what it found.
  review_reasons:
    by_action:
      refund: refund
      cancel_and_refund: cancellation
    by_finding:
      CLAIM_UNSUPPORTED: hallucination_unsupported
      LOW_CONFIDENCE_DEGENERATE: low_confidence
      LOW_CONFIDENCE_SPECIFIC: low_confidence
    hallucination: hallucination_contradicted
  # One human review queue: refunds above the limit, and replies the hallucination check cut.
  review_output:
    # A customer in a review table: who, and the account the record carries.
    customer_cell: "{name} (#{id})"
    # Appended to the HALLUCINATION CHECK card when a cut reply was queued.
    queued: "queued for review #{id} · {reason}"
    # What the model reads when an escalated call could not be queued. The
    # Gatekeeper's own reason names the limit, and the model must never hold it;
    # that reason goes to the log and the audit trail only.
    not_queued: "That action needs a person's approval, but it could not be sent for review: {error}"
    no_referral: "That action needs a person's approval."
    # What the customer is sent when a reviewer says the check was wrong.
    reply_follow_up: "Following up on my last reply: a colleague has checked it, and this part stands. {removed}"
    title: "Review request #{id} — {decision}"
    labels: {request: request, decided: decided, effect: effect, customer: customer}
    request:
      refund: "refund · order {order_id} · {amount}"
      cancel_and_refund: "cancel and refund · order {order_id} · {amount}"
      reply: 'reply · {reason} · removed: "{removed}"'
    decided: "{decision} by {reviewer}"
    effects:
      refund_approved: refund issued
      refund_denied: "no money moved · {reason}"
      cancel_and_refund_approved: order cancelled and refund issued
      cancel_and_refund_denied: "no money moved · {reason}"
      reply_approved: the removed text was sent to the customer
      reply_denied: nothing more sent · the check stands
      failed: "failed · {reason}"
    customer_told: 'told: "{reply}"'
    customer_not_told: not notified · no open conversation
    not_pending: "Request {id} is not pending (already decided, or not found). /queue lists what is waiting."
  dummy_data_generator_path: src/customer_support_agent/dummy_data/generator.yaml
  # This agent's evals: the golden set, the fixture it runs against, and what its graders
  # read. Run with `make eval csa` (see agent_platform/evals).
  evals:
    dataset_path: src/customer_support_agent/evals/dataset/golden_cases.yaml
    fixture_seed_path: src/customer_support_agent/evals/dataset/fixtures/eval_seed.sql
    fixture_db_path: db/customer_support_agent/eval_fixture.db
    workspace_dir: data/customer_support_agent/evals/workspace
    quality_metrics_path: src/customer_support_agent/evals/deepeval/metrics.yaml
    security_config_path: src/customer_support_agent/evals/promptfoo/promptfooconfig.yaml
    session_prefix: eval
    chatbot_role: >-
      A customer-support agent for an online store. It answers questions about the signed-in
      customer's own orders and refunds, and issues a full refund only when the written
      policy allows it: larger refunds go to a person for approval, and anything the policy
      forbids is refused with the reason.
    grounding_roles: [system, tool]
    keep_case_workspaces: false
    # A reply may only cite order ids and amounts the agent was shown.
    order_reference_pattern: '\b\d{5}\b'
    money_pattern: '\$\s?(\d[\d,]*(?:\.\d{1,2})?)'
    money_tools: [support.process_refund, support.cancel_order]
    prompt_leak_ngram: 8
    # `make intent-eval csa`: each contender (a config profile; [] is the agent as
    # configured) classifies the same labelled messages, model alone and through the router.
    intent_bakeoff:
      cases_path: src/customer_support_agent/evals/intent/cases.yaml
      report_title: CSA intent classifier bake-off
      calibration_bins: 10
      # A threshold tuned on one model's scores is not another's: read every contender here.
      threshold_sweep: [0.3, 0.4, 0.5, 0.6, 0.75, 0.9]
      # Each classifier with the phrase rules on and off, each at its own threshold.
      contenders:
        laya: []
        laya_no_rules: [src/customer_support_agent/config/profiles/no_phrase_rules.yaml]
        bert: [src/customer_support_agent/config/profiles/bert_intent.yaml]
        bert_no_rules:
          - src/customer_support_agent/config/profiles/bert_intent.yaml
          - src/customer_support_agent/config/profiles/no_phrase_rules.yaml

tui:
  # The order table, coloured by state. Anchored to a table cell (`│ word │`), so the same word in
  # a sentence is left alone. Named terminal colours, so they read on a light or a dark theme.
  response_highlights:
    # The order table. The grid recedes; the headings read as headings, not as a row.
    - {pattern: '^[┌├└][─┬┼┴┐┤┘]+$', style: "bright_black"}
    - {line: '^│', pattern: '│', style: "bright_black"}
    - {line: '^│ +# +│', pattern: '[^│\s][^│]*?(?=\s*│)', style: "bold cyan"}
    # Position and date are secondary; the order id and total are what a customer quotes.
    - {line: '^│', pattern: '(?<=^│ ) *\d+(?= │)', style: "bright_black"}
    - {line: '^│', pattern: '(?<=│ )\d{4}-\d{2}-\d{2}(?= +│)', style: "bright_black"}
    - {line: '^│', pattern: '(?<=│ )\d{5}(?= +│)', style: "bold"}
    - {line: '^│', pattern: '\$[\d,]+\.\d{2}(?= │$)', style: "bold"}
    - {pattern: '(?<=│ )delivered(?= +│)', style: "green"}
    - {pattern: '(?<=│ )on its way(?= +│)', style: "cyan"}
    - {pattern: '(?<=│ )being prepared(?= +│)', style: "yellow"}
    - {pattern: '(?<=│ )cancelled(?= +│)', style: "red"}
    - {pattern: '(?<=│ )awaiting review(?= +│)', style: "bold yellow"}
    - {pattern: '(?<=│ )(?:approved|refunded in full)(?= +│)', style: "bold green"}
    - {pattern: '(?<=│ )declined(?= +│)', style: "bold red"}
    - {pattern: '(?<=│ )none(?= +│)', style: "bright_black"}
  # One-line card summaries for this agent's own reason codes.
  reason_summaries:
    ORDER_REFERENCE_NOT_PRESENT: order reference not provided · validation deferred

# Context management (platform `context.*`), as this agent needs it.
context:
  offload:
    # The offload fetch tool returns only what was in this agent's own window: it is governed
    # by the permission the agent already reads orders with.
    tool_permission: read_orders
