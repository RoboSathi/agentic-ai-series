agent:
  id: customer_support_agent
  version: 0.1.0
memory:
  episodic:
    path: src/customer_support_agent/dummy_data/episodic
customer_support_agent:
  enabled: true
  db_path: src/customer_support_agent/dummy_data/agentic.db
  max_tool_iterations: 5
  intents:
  - name: ORDER_STATUS
    mode: read
    phrases:
    - where is my order
    - where is the order
    - where is order
    - track my order
    - track order
    - order status
    - has my order arrived
    - when will my order arrive
    tools:
    - get_order_status
    description: checking whether an order has shipped, arrived, or where it is
  - name: ORDER_DETAILS
    mode: read
    phrases:
    - order details
    - details of my order
    - details of the order
    - show me my order
    - what did i order
    tools:
    - get_order_status
    description: asking for details about a specific order
  - name: REFUND_STATUS
    mode: read
    phrases:
    - refund status
    - where is my refund
    - where is the refund
    - has my refund
    - refund update
    - refund pending
    - when will my refund
    - refund completed
    - refund approved
    - refund denied
    tools:
    - get_refund_status
    description: checking the status or timing of an existing refund
  - name: REQUEST_REFUND
    mode: write
    phrases:
    - i want a refund
    - want a refund
    - request a refund
    - please refund
    - issue a refund
    - get a refund
    - refund this order
    - refund
    - money back
    - reimburse
    - chargeback
    tools:
    - get_order_status
    - get_refund_status
    - process_refund
    - queue_for_approval
    description: asking to receive a refund for an order
  - name: UNKNOWN
    phrases: []
    tools: []
    description: a request that does not clearly fit a supported customer-support
      capability
  default_intent: UNKNOWN
  plans:
    ORDER_STATUS:
    - description: look the order up and report its state
      tool: get_order_status
    ORDER_DETAILS:
    - description: look the order up and report its details
      tool: get_order_status
    REFUND_STATUS:
    - description: check the current refund status
      tool: get_refund_status
    REQUEST_REFUND:
    - description: confirm the order and its current state
      tool: get_order_status
    - description: check whether the order is eligible for a refund
      tool: get_refund_status
    - description: issue the refund, or queue it for a human
      tool: process_refund
    UNKNOWN: []
  intent_router:
    enabled: true
    # Routing threshold applied to the mapped model-softmax score. This is an
    # agent-level routing policy, not a calibrated probability guarantee.
    confidence_threshold: 0.75
    clarification_top_k: 2
    clarification_template: Could you clarify whether you need help with {options}?
    deterministic_rejects:
    - rule_id: WEATHER_REQUEST
      pattern: '\b(?:weather|forecast|temperature|rain(?:ing)?|snow(?:ing)?)\b'
      reason: Weather requests are outside Customer Support capabilities.
    - rule_id: POLITICAL_INFORMATION_REQUEST
      pattern: '\b(?:who\s+is\s+(?:the\s+)?(?:prime\s+minister|president|chief\s+minister))\b'
      reason: General political-information requests are outside Customer Support
        capabilities.
    - rule_id: PROGRAMMING_REQUEST
      pattern: '\b(?:write|generate|debug|fix)\s+(?:a\s+)?(?:python|javascript|java|code|program|script)\b'
      reason: Programming requests are outside Customer Support capabilities.
    model_label_mapping:
      ORDER_STATUS:
      - track_order
      - delivery_period
      - delivery_options
      ORDER_DETAILS: []
      REFUND_STATUS:
      - track_refund
      REQUEST_REFUND:
      - get_refund
      UNKNOWN:
      - fallback
      - FALLBACK
  followup:
    phrases:
    - what about
    - how about
    - and
    - what of
    - also
    - same for
    - check
    reference_pattern: \b\d{4,}\b
  history_turns: 6
  deliberation_markers:
  - we need to
  - we should
  - let me
  - i should
  - i need to
  - the user
  - the customer wants
  - according to policy
  - 'first, '
  - next, i
  - so the answer
  user_code_length: 7
  user_code_alphabet: ABCDEFGHJKMNPQRSTUVWXYZ23456789
  demo_user_code: 2HEDZTV
  checkpoint_path: src/customer_support_agent/dummy_data/checkpoints.db
  policy_path: src/customer_support_agent/prompts/customer_policy.md
