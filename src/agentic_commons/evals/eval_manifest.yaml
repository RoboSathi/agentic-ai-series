# The eval plan, checked in (E09's exit artifact).
#
# One row per component that can regress. A component absent from this
# file has no regression signal — that absence is meant to be visible
# here, not discovered in production.
#
# regression_threshold is the pass rate below which CI fails the level.

evals:
  - component: llm.client
    input_distribution: fixed prompt set covering tool-calling and plain completion
    expected_properties:
      - returns non-empty content or a tool call
      - reports token usage and cost
    scorer: exact_assertion
    regression_threshold: 0.95
    level: component

  - component: evals.scoring
    input_distribution: claims with evidence spanning supported, contradicted, ambiguous
    expected_properties:
      - resolves at the cheapest sufficient tier
      - never fabricates a verdict when every tier declines
    scorer: deterministic_rule
    regression_threshold: 1.0
    level: component

  - component: context.assembly
    input_distribution: conversations from 2k to 150k tokens
    expected_properties:
      - stays within the configured token budget
      - preserves the most recent turn
    scorer: deterministic_rule
    regression_threshold: 1.0
    level: component

  - component: memory.write_pipeline
    input_distribution: candidate memories including conflicting and unauthorized writes
    expected_properties:
      - conflicting writes are reconciled, never silently overwritten
      - provenance is attached to every stored item
    scorer: deterministic_rule
    regression_threshold: 1.0
    level: component

  - component: guardrails.schema
    input_distribution: model outputs including malformed and truncated JSON
    expected_properties:
      - invalid output is repaired or rejected, never passed through
    scorer: deterministic_rule
    regression_threshold: 1.0
    level: component

  - component: gatekeeper.authorization
    input_distribution: tool calls across every authority rank and blast radius
    expected_properties:
      - no unauthorized action is ever allowed
      - every decision produces exactly one audit entry
    scorer: deterministic_rule
    regression_threshold: 1.0
    level: integration

  - component: gatekeeper.ledger
    input_distribution: sequences of individually-permitted actions that breach in aggregate
    expected_properties:
      - cumulative spend crossing a threshold escalates
    scorer: deterministic_rule
    regression_threshold: 1.0
    level: integration

  - component: security.prompt_injection
    input_distribution: benign queries plus documented injection patterns
    expected_properties:
      - injected instructions do not alter tool authorization
    scorer: deterministic_rule
    regression_threshold: 1.0
    level: integration

  - component: tools.selection
    input_distribution: tasks against a 50-tool registry
    expected_properties:
      - selection accuracy recovers with namespacing and retrieval
      - irrelevant tool exposure stays below the configured rate
    scorer: embedding_similarity
    regression_threshold: 0.8
    level: integration

  - component: resilience.saga
    input_distribution: refund flows with failures injected at each step
    expected_properties:
      - every committed step is compensated on failure
    scorer: deterministic_rule
    regression_threshold: 1.0
    level: integration

  - component: customer_support_agent.refund
    input_distribution: golden refund conversations across auto-approve and escalation paths
    expected_properties:
      - refunds above the threshold are queued, never auto-approved
      - the response cites the order it acted on
    scorer: calibrated_llm_judge
    regression_threshold: 0.9
    level: golden_task

  - component: customer_support_agent.live
    input_distribution: production traffic, scored but not served
    expected_properties:
      - hallucination rate stays within its SLO
      - cost per successful outcome stays within budget
    scorer: calibrated_llm_judge
    regression_threshold: 0.85
    level: production_shadow
