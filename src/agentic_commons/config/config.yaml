# Tracked defaults for every live subsystem. Never put API keys here — those
# come from bare environment variables (nvidia_api_key, hf_api_key).
#
# Every governance feature and sub-feature is an independent `enabled` flag
# (PRD G6) and can be flipped live at runtime via agentic_commons.config's
# FeatureToggle — no restart. The Gatekeeper itself is always invoked (PRD
# G1); only its sub-features are toggleable.
#
# Override anything locally via config/local.yaml (gitignored). Paths are
# resolved relative to the repository root, never the shell's CWD.
#
# Parked packages (sandbox, control_loop, prompt_compilation) and the
# stub-only multi_agent package deliberately have no config surface yet.

# Agent configuration layered on top of these platform defaults, in order.
# Each agent owns its own action names, roles, thresholds and data paths;
# leaving them here would make every agent inherit one agent's vocabulary.
overlays:
  - src/customer_support_agent/config/config.yaml

config:
  enabled: true

logging:
  enabled: true
  level: INFO
  console_enabled: true
  console_level: INFO
  file_enabled: true
  # The file log is the authoritative record, so it captures more than the
  # console: DEBUG here is what makes LLM payloads, call traces and
  # gatekeeper reasoning available after the fact without flooding the
  # screen someone is watching.
  file_level: DEBUG
  dir: logs
  per_subsystem_color: true
  # How much of a traced argument or return value is written. 0 means all
  # of it: the argument you need to read back is always the long one, and
  # an elided payload turns the log from evidence into a hint.
  payload_max_chars: 0
  max_bytes: 5000000
  backup_count: 3

llm:
  enabled: true
  provider: nim            # nim | local — the default single-tier client
  max_tokens: 3000
  # Write every request and response to logs/llm.log at DEBUG. The single
  # most useful switch when the agent misbehaves: it shows what the model
  # was actually asked, which is rarely what you assume it was asked.
  # Off by default — payloads are verbose and may carry customer text.
  log_payloads: true
  # Characters kept per message when logging payloads. 0 means the whole
  # thing: a truncated prompt hides the end of the system prompt and the
  # most recent turn, which is usually the part you are debugging.
  payload_max_chars: 0
  providers:
    nim:
      base_url: https://integrate.api.nvidia.com/v1
      # NIM entitlements are per-account; this model is confirmed invokable
      # and does reliable multi-step tool calling for the refund agent.
      # (nvidia/nemotron-3.5-lightning-30b-a3b is invokable but narrates
      # chain-of-thought instead of answering.) It does NOT honor
      # guided_json/response_format — see guardrails.constrained_backend.
      model: nvidia/nemotron-3-super-120b-a12b
      # meta/llama-3.2-11b-vision-instruct, nvidia/nemotron-3-super-120b-a12b, nvidia/nemotron-3-ultra-550b-a55b
      timeout_seconds: 60
      input_cost_per_1k_tokens: 0.0002
      output_cost_per_1k_tokens: 0.0006
    local:
      base_url: http://localhost:8080/v1
      model: mistral-nemo-12b
      timeout_seconds: 120
      input_cost_per_1k_tokens: 0.0
      output_cost_per_1k_tokens: 0.0
  cascade:
    enabled: false
    tiers: [local, nim]    # cheapest sufficient tier first (E44)
    escalate_on_finish_reasons: [length]
    escalate_on_empty_content: true
    escalate_on_error: true
  embedding:
    provider: nim          # nim | local
    nim_model: nvidia/nemotron-3-embed-1b
    local_dimensions: 256
  # Hosted BERT-family encoders. These answer questions a generative
  # model answers worse and dearer: does this evidence *entail* this
  # claim, and which of these ten passages actually answers the query.
  # The key comes from the bare `hf_api_key` environment variable; with
  # no key, every caller silently uses its deterministic fallback.
  encoders:
    enabled: true
    base_url: https://api-inference.huggingface.co/models
    # A cross-encoder trained on NLI. It reads premise and hypothesis
    # together, which is what lets it separate "refund approved" from
    # "refund denied" — two strings a bi-encoder scores as near-identical.
    nli_model: cross-encoder/nli-deberta-v3-base
    # A reranking cross-encoder, run only over a retrieved shortlist.
    reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
    timeout_seconds: 10
    # Hosted models scale to zero. Waiting is right for an eval run and
    # wrong for a customer waiting on a reply, so the caller that cannot
    # afford the cold start gets the fallback instead.
    wait_for_model: false

persistence:
  enabled: true
  # Neutral default. Each agent overlays its own database path so nothing
  # writes into the shared library's folder.
  db_path: data/agentic.db

audit:
  enabled: true
  # Nine things version independently (E39). One release number cannot
  # answer "which of them moved?", which is the only question worth
  # asking after a regression.
  policy_version: refund-policy-v1
  data_version: dummy-data-v1
  prompt_version: support-prompt-v1
  tool_schema_version: support-tools-v1

observability:
  enabled: true
  langsmith_enabled: false
  langsmith_project: agentic-harness-core
  persist_traces: true
  slo_targets:
    task_success_rate: 0.95
    unauthorized_action_rate: 0.0
    hallucination_rate: 0.05
    escalation_rate: 0.20
    loop_abort_rate: 0.05
    tool_failure_rate: 0.05
    recovery_success_rate: 0.90
    policy_violation_rate: 0.0
  review_queue:
    minutes_per_hour: 60
    # How long one escalation takes a reviewer. Feeds both the Little's
    # Law capacity model and the human-review line of the cost stack.
    minutes_per_review: 8
  # Unit prices for the parts of a request that are not tokens. An agent
  # whose cost model stops at tokens reports a cost-per-success that is
  # wrong in the direction that flatters it: tool calls, retrieval,
  # evaluator passes and human review are what actually add up.

context:
  enabled: true
  token_budget: 3000
  chars_per_token: 4
  retrieval_mode: hybrid   # lexical | dense | hybrid | graph
  top_k: 5
  hybrid_lexical_weight: 0.5
  # Two-pass scoring (E19). The cheap ranker scores every candidate; a
  # cross-encoder then rescores the best few, reading query and passage
  # together. Bounded to a shortlist because that cost is what stops a
  # cross-encoder being usable over a corpus.
  rerank:
    enabled: true
    shortlist: 10
    # Below this, reranking cannot change the answer — reordering two
    # chunks that both fit the budget buys nothing for a network call.
    min_candidates: 3
  bm25_k1: 1.5
  bm25_b: 0.75
  strategies:
    offload: true
    reduce: true
    retrieve: true
    isolate: true
    cache: true
    consolidate: true
  reduce_keep_ratio: 0.5
  failure_detection:
    enabled: true
    checkpoints_tokens: [10000, 30000, 60000, 100000, 150000]
    degradation_threshold: 0.2

memory:
  enabled: true
  schema_version: memory-schema-v1
  working:
    enabled: true
  episodic:
    enabled: true
    # Neutral default; each agent overlays its own session-log directory.
    path: data/episodic
  semantic:
    enabled: true
    fuzzy_match_threshold: 0.6
  procedural:
    enabled: true
  write_pipeline:
    enabled: true
    # Openers that mark a question rather than a claim. A question states
    # no fact, so it is discarded before classification — otherwise every
    # message becomes a candidate memory and the curator queue fills with
    # things nobody asserted.
    interrogative_markers:
      - who
      - what
      - when
      - where
      - why
      - how
      - which
      - can you
      - could you
      - would you
      - will you
      - do you
      - does
      - did
      - is
      - are
      - was
      - were
      - should
      - tell me
      - show me
    auto_commit_threshold: 0.8
    discard_threshold: 0.3
    decay_if_unconfirmed_days: 30
    # Fact categories that may never be written from conversational
    # assertion, whatever confidence the speaker expresses (E15/E16). No
    # role's permission set includes granting itself authority.
    authority_changing_categories:
      - policy_limit
      - permission_grant
      - role_assignment
      - authority_delegation
    # Deterministic first-tier classification: phrase -> category. Cheap,
    # auditable, and reached for before any model (the NOLLM discipline).
    classification_hints:
      policy_limit: ["refund limit", "spending limit", "my limit is", "cap is now", "threshold is now"]
      permission_grant: ["i am authorized", "grant me", "give me access", "i have permission"]
      role_assignment: ["i am an admin", "i am a supervisor", "my role is"]
      authority_delegation: ["on behalf of", "acting for", "delegated to me"]
      preference: ["i prefer", "i like", "please always", "don't ever"]
      order_fact: ["order", "tracking", "delivered", "shipment"]
  # Retrieval weighting by how a fact came to be known (E16).
  provenance_weights:
    verified_system_of_record: 1.0
    agent_inference: 0.6
    self_reported: 0.3
  retrieval_weights:
    relevance: 0.4
    recency: 0.2
    importance: 0.15
    authority: 0.15
    temporal_validity: 0.1
  recency_half_life_days: 14

guardrails:
  enabled: true
  mode: auto_repair        # reject | auto_repair | constrained
  max_repair_attempts: 2
  constrained_backend: llamacpp_grammar   # llamacpp_grammar | nim_guided_json

hallucination_protection:
  enabled: true
  confidence_threshold: 0.7
  consistency_samples: 3
  consistency_agreement_threshold: 0.67
  grounding_overlap_threshold: 0.3

gatekeeper:
  # The Gatekeeper is always invoked (PRD G1). These are its sub-features.
  authority_grant_max_rank: 5
  # The Authority Hierarchy, strongest first. Only the first
  # `authority_grant_max_rank` sources can grant or expand authority;
  # everything below them is input to be acted on, never instruction to
  # be obeyed — which is why a tool result cannot authorize anything.
  authority_hierarchy:
    - provider
    - organization
    - product
    - workspace
    - user_task
    - runtime_reminders
    - tool_observations
    - untrusted_content
  ledger:
    enabled: true
    window_hours: 24
    # Action -> budget class, and the cap per class. Empty here: the
    # actions belong to the agent, so the agent supplies both.
    action_classes: {}
    thresholds_usd: {}
  tier2:
    enabled: false
  surface_policy:
    enabled: true
    # action -> surface class. Empty here, filled by the agent. An
    # unmapped action defaults to human-controlled, which fails safe.
    surfaces: {}
  automation:
    enabled: true
    # Sheridan 1-10. Levels <= human_approval_below require a human.
    human_approval_below: 5
    # Sheridan level per action, and the amount forcing a human. Empty
    # here: these are the agent's actions. An unconfigured action sits at
    # the approval floor rather than defaulting to autonomous.
    levels: {}
    per_action_amount_escalation_usd: {}

security:
  # A sub-feature is enabled only if its parent is too. RBAC (auth) stays on
  # because the Gatekeeper's "who is asking?" question depends on it; the
  # content-level checks are off by default.
  enabled: true
  auth:
    enabled: true
    elevation_max_ttl_seconds: 900
    # Roles and the action -> permission mapping. Empty here: an agent's
    # actions are its own. Unmapped means denied, which fails safe.
    roles: {}
    action_permissions: {}
  pii:
    # On. Traces, logs and tool calls all carry customer text, and a
    # detector that is switched off is a detector that is not there.
    # `mask` keeps the shape of a value without its content, so a
    # redacted trace is still readable as a trace.
    enabled: true
    mode: mask             # mask | tokenize | remove
    mask_token: "[REDACTED]"
    ner_enabled: false
    # Detector patterns, ordered most-specific first so a card number is not
    # first matched as a shorter numeric identifier.
    patterns:
      credit_card: '\b(?:\d[ -]?){13,16}\b'
      ssn: '\b\d{3}-\d{2}-\d{4}\b'
      email: '\b[\w.+-]+@[\w-]+\.[\w.-]+\b'
      phone: '(?<!\d)(?:\+?\d{1,2}[ -])?\(?\d{3}\)?[ -]\d{3}[ -]\d{4}(?!\d)'
      ip_address: '\b\d{1,3}(?:\.\d{1,3}){3}\b'
    # Fields a tool call may carry; everything else is dropped before the
    # call leaves the harness (data minimization, E32).
    tool_call_allowed_fields: [order_id, user_id, amount, reason, status]
  prompt_injection:
    # On: untrusted text is delimited and the tool surface narrowed before
    # anything is concatenated into a prompt. This is an agent talking to
    # the public, and the defence costs one pass over the message.
    enabled: true
    data_open_tag: "<untrusted_data>"
    data_close_tag: "</untrusted_data>"
    suspicious_phrases:
      - ignore previous instructions
      - ignore all previous
      - disregard the above
      - you are now
      - system prompt
      - new instructions
      - override your
      - my refund limit is now
  content_moderation:
    enabled: true
    blocked_terms: [kill, bomb, terrorist]

resilience:
  enabled: true
  circuit_breaker:
    enabled: true
    failure_threshold: 3
    half_open_after_seconds: 30
  retry:
    enabled: true
    max_attempts: 3
    base_delay_seconds: 0.2
    max_delay_seconds: 2.0
  timeout:
    enabled: true
    default_seconds: 30
  bulkhead:
    enabled: true
    pool_size: 4
  idempotency:
    enabled: true
  saga:
    enabled: true

evals:
  enabled: true
  manifest_version: eval-manifest-v1
  manifest_path: src/agentic_commons/evals/eval_manifest.yaml
  cascade:
    exact_assertion: true
    deterministic_rule: true
    embedding_similarity: true
    nli_entailment: true
    calibrated_llm_judge: true
    human_adjudication: true
  embedding_similarity_threshold: 0.85
  embedding_dissimilarity_threshold: 0.3
  nli_entailment_threshold: 0.7
  judge_confidence_threshold: 0.7
  kappa_acceptable: 0.6
  # Lexical entailment fallback used when no hosted NLI endpoint is wired.
  nli:
    min_overlap: 0.4
    negation_markers:
      - "not"
      - "no"
      - "never"
      - "cannot"
      - "n't"
      - "without"
      - "denied"
      - "refused"
      - "unable"
  judge:
    temperature: 0.0
    max_tokens: 256

tools:
  enabled: true
  selection_k: 5
  # Relevance floor for offering a tool at all. Below this, the turn is
  # offered NO tools rather than the full set — a conversational message
  # ("who are you?") must not be handed a money-moving tool just because
  # it scraped a weak similarity score.
  #
  # The scale is specific to the configured embedding backend: measured
  # against the current one, an unrelated query scores under 0.07 and a
  # genuine order query scores over 0.24. Re-measure this if the
  # embedding model changes.
  selection_min_score: 0.15

# Console slash commands (/help, /orders, /audit …). These are operator
# views of the harness, so the limits here are about what fits on a
# terminal, not about what the agent may do.
commands:
  default_limit: 15        # rows a listing shows when no limit is given
  value_preview_chars: 40  # where a long stored value is elided in a table
  recent_window: 20        # how many recent records the summaries look back over

tui:
  refresh_interval_ms: 100
  show_token_count: true
  copy_method: osc52       # osc52 | file
  max_feed_lines: 500
  spinner_frames: "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏"
  # What each step says on screen. These are read by a person watching the
  # agent work, so they name the *work*, not the method being called.
  stage_labels:
    intake: Receiving request…
    prompt_injection_check: Checking for prompt injection…
    pii_filtering: Filtering PII…
    content_moderation: Checking content policy…
    working_memory_check: Checking working memory…
    context_assembly: Assembling context…
    llm_call: Calling model…
    llm_response_received: Model responded
    output_parsing: Parsing output…
    guardrail_validation: Validating output structure…
    hallucination_check: Checking response grounding…
    gatekeeper_evaluation: Checking authorization…
    tool_execution: "{tool_name}"
    order_status_check: Checking order status…
    refund_eligibility_check: Checking refund eligibility…
    memory_write: Updating memory…
    audit_record: Recording audit trail…
    finalize: Composing the reply…
    intent_classification: Understanding the intention of request…
    scope_check: Checking this is something I can help with…
    authentication: Verifying your account…
    tool_suppressed: Already had that answer — skipping the repeat
    tool_refused: Action not available for this request
    order_lookup: Checking order details
    working_memory_write: Noting that for this conversation…
    memory_recall: Recalling what this conversation established…
  # Per-tool wording, supplied by each agent for its own tools. An
  # unlabelled tool degrades to a readable fallback rather than failing.
  tool_labels: {}
  # Colour per step, so the feed is scannable rather than a wall of green.
  # Grouped by what the step *is*: security checks warn, data preparation
  # is cool, model calls are blue, authority decisions stand out, and only
  # a completed action or the final reply is green.
  stage_styles:
    intake: white
    intent_classification: bright_magenta
    scope_check: yellow
    authentication: bright_cyan
    prompt_injection_check: yellow
    pii_filtering: yellow
    content_moderation: yellow
    working_memory_check: cyan
    context_assembly: cyan
    memory_write: cyan
    llm_call: blue
    llm_response_received: bright_blue
    output_parsing: blue
    guardrail_validation: magenta
    hallucination_check: magenta
    gatekeeper_evaluation: bright_magenta
    tool_execution: green
    tool_suppressed: bright_black
    tool_refused: red
    order_status_check: green
    refund_eligibility_check: green
    audit_record: bright_black
    finalize: bright_green
    order_lookup: cyan
    working_memory_write: dodger_blue1
    memory_recall: dodger_blue1
  default_stage_style: white
  # Mirroring the log stream onto the screen. On by default while the
  # system is being built out: seeing every step is how the flow gets
  # understood, and `/debug off` (or level: INFO) quiets it again without
  # touching the files, which stay complete regardless.
  # The live trace: what the code is doing, while it does it.
  #
  # Curated, not exhaustive. Narrating every instrumented call produced
  # forty lines a turn from eight modules, which is a log file on a
  # screen — technically complete and practically unreadable. So the
  # screen shows the steps below and nothing else, one line each, with
  # what went in and what came out. Everything else is in logs/, in full.
  trace:
    enabled: true
    level: DEBUG          # DEBUG | INFO | WARNING | ERROR
    subsystem_width: 12
    action_width: 34
    max_values: 2           # inputs shown beside a step
    max_value_chars: 40     # where a value is elided to keep one line
    # Author-written log lines (logger.info) also reach the screen: they
    # are already sentences, written by whoever knew what mattered.
    show_events: true
    # What each subsystem is called on screen. Truncating
    # "customer_support_agent" to fit a column produces "customer_su",
    # which is not a word; these are.
    subsystem_labels:
      customer_support_agent: agent
      hallucination_protection: grounding
      observability: observe
      design_patterns: patterns
    # The steps worth a line, and what to call each one. `Class.method`
    # -> the phrase a person reads. Adding a step to the screen is a
    # config change; the code never grows a list of what to narrate.
    steps:
      ScopeGuard.check: screening the request
      CustomerAuthenticator.authenticate: verifying the customer
      IntentClassifier.classify: working out the intent
      SecuritySuite.prepare_untrusted: checking for prompt injection
      SecuritySuite.moderate: checking content policy
      MemoryFacade.note: noting for this conversation
      MemoryFacade.recall: recalling from memory
      MemoryWritePipelineImpl.process: routing a memory write
      FiveStagePipeline.assemble: assembling the context window
      ToolRetrievalSelector.select: choosing which tools to offer
      NvidiaNimClient.complete: asking the model
      OpenAICompatibleClient.complete: asking the model
      LocalLlamaCppClient.complete: asking the model
      GatekeeperImpl.evaluate: checking authority
      NamespacedToolRegistry.build_call: validating the tool arguments
      NamespacedToolRegistry.invoke: running the tool
      RefundSaga.execute: processing the refund
      DetectionLadder.assess: checking the answer is grounded
      NollmScoringCascadeImpl.resolve: resolving a claim
      HostedNliModel.entails: checking entailment
      HostedCrossEncoderRanker.rank: reranking the shortlist
      ReviewQueueService.approve: approving a queued refund
      ReviewQueueService.deny: denying a queued refund
    # Fields that are *content* rather than identity. Printing an
    # assembled window or a stored fact turns the trace into the thing it
    # is meant to summarise.
    muted_fields:
      - args
      - kwargs
      - result
      - content
      - context
      - messages
      - text
      - value
      - chunks
      - facts
      - payload
      - prompt
      - trace_id
      - evidence
      - unsupported
      - instructions
      - raw_arguments
      - provenance
      - session_id
      - source
  # How a slash command's output is drawn in the feed. Commands answer
  # about the system rather than the customer, so they are styled apart
  # from the conversation — a reader should never mistake `/orders` output
  # for something the agent said.
  command_output:
    title_style: bold bright_cyan
    header_style: bold bright_black
    row_style: white
    note_style: dim
    error_style: red
    column_gap: 2
    max_column_width: 64
    prompt_style: bold bright_black

