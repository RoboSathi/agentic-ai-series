# Coverage checklists — what the interview must establish, per archetype.
#
# Each item is `open` until the user's answers cover it, or `waived` when
# the user closes scoping with it unsettled (it then becomes a *known
# unknown* on the Brief, which the Rubric and the report must acknowledge).
#
#   item_id      stable id; the ScriptedUser in evals answers by this id
#   prompt       what the interviewer asks
#   required     whether the agent may propose "done" while it is open
#   brief_field  the ScopeBrief field the answer fills
#   multi        the answer is a list (comma / semicolon / " and " separated)
#   private      the value must never leave the process (queries, URLs)

common: &common
  - item_id: purpose
    prompt: What will you do with the answer — what decision or action does it feed?
    required: true
    brief_field: purpose
  - item_id: recency
    prompt: How recent must sources be? Give a window in days (e.g. 365), or say "any".
    required: false
    brief_field: recency_days
  - item_id: sources
    prompt: Any sources to prefer or avoid? Name domains, or say "primary sources preferred".
    required: false
    brief_field: source_policy
  - item_id: context
    prompt: Anything about your own situation I should know (budget, organisation)? This stays private and is never searched for.
    required: false
    brief_field: private_terms
    multi: true
    private: true
  - item_id: deliverable
    prompt: What should the deliverable look like — a short memo, a table, a detailed report?
    required: false
    brief_field: deliverable_format

decision_support:
  - item_id: decision
    prompt: What exactly is being decided, and by when?
    required: true
    brief_field: decision
  - item_id: options
    prompt: Which options are on the table? List each one.
    required: true
    brief_field: options
    multi: true
  - item_id: criteria
    prompt: Which criteria matter for the choice? List each one (cost, safety, …).
    required: true
    brief_field: criteria
    multi: true
  - item_id: constraints
    prompt: Any hard constraints that rule an option out regardless of score?
    required: false
    brief_field: constraints
    multi: true
  - *common

landscape_brief:
  - item_id: scope_boundary
    prompt: Where does the landscape start and stop — which segment, which region?
    required: true
    brief_field: geography
  - item_id: criteria
    prompt: What should the map show for each player (approach, scale, funding, …)?
    required: true
    brief_field: criteria
    multi: true
  - item_id: known_players
    prompt: Which players do you already know about? I will look beyond them.
    required: false
    brief_field: options
    multi: true
  - *common

fact_verification:
  - item_id: claims
    prompt: Which claims should I verify? Quote each one as you have seen it.
    required: true
    brief_field: claims
    multi: true
  - item_id: claim_origin
    prompt: Where did you see these claims? It helps me find the primary source.
    required: false
    brief_field: constraints
    multi: true
  - *common

explainer:
  - item_id: audience
    prompt: Who is the explanation for, and what do they already know?
    required: true
    brief_field: decision
  - item_id: concepts
    prompt: Which sub-concepts must the explanation cover? List each one.
    required: true
    brief_field: concepts
    multi: true
  - item_id: criteria
    prompt: What makes the explanation good enough — examples, numbers, a diagram in words?
    required: false
    brief_field: criteria
    multi: true
  - *common

# A Research run on a question no specialised kind fits: the question is
# the topic (from the first message); the interview settles why, how
# recent, from where, and in what shape.
general:
  - item_id: purpose
    prompt: What will you do with the answer — what decision or action does it feed?
    required: true
    brief_field: purpose
  - item_id: recency
    prompt: How recent must sources be? Give a window (e.g. "last 3 months", 365 days), or say "any".
    required: false
    brief_field: recency_days
  - item_id: criteria
    prompt: What must the answer cover to be useful to you? List each point.
    required: false
    brief_field: criteria
    multi: true
  - item_id: sources
    prompt: Any sources to prefer or avoid? Name domains, or say "primary sources preferred".
    required: false
    brief_field: source_policy
  - item_id: context
    prompt: Anything about your own situation I should know (budget, organisation)? This stays private and is never searched for.
    required: false
    brief_field: private_terms
    multi: true
    private: true
  - item_id: deliverable
    prompt: What should the deliverable look like — a short memo, a table, a detailed report?
    required: false
    brief_field: deliverable_format
