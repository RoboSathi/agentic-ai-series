  # -- explainer: iron-air -----------------------------------------------------
  - url: https://energywiki.example/iron-air
    title: Iron-air battery
    published: "2025-12-01"
    body: |
      An iron-air battery discharges by oxidising iron into rust.
      Charging an iron-air battery reverses the reaction, turning rust back into iron.
      Round-trip efficiency of iron-air systems is typically around 40 percent.
      The discharge duration of iron-air systems is often 100 hours or more.
  - url: https://kelvari-uni.example/courses/iron-air-primer
    title: Iron-air primer (Kelvari University)
    published: "2026-02-09"
    primary: true
    body: |
      Iron-air cells pair an iron anode with an air-breathing cathode.
      When discharging, iron reacts with oxygen from the air and forms iron oxide, commonly called rust.
      Charging drives the reaction backwards and turns rust back into iron.
      Round-trip efficiency of iron-air cells is roughly 40 to 45 percent, lower than lithium-ion.
      A multi-day discharge duration makes iron-air suited to seasonal gaps in supply.
  - url: https://storage-digest.example/why-iron-air-is-slow
    title: Why iron-air trades efficiency for cost
    published: "2026-03-22"
    body: |
      Iron-air batteries trade efficiency for cost, accepting a round-trip efficiency near 40 percent because iron is cheap.
      A discharge duration of about 100 hours lets one iron-air system bridge several days without sun or flow.

