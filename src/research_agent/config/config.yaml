# The research agent's overlay on the platform defaults (agent_platform).
# Loaded when AGENTIC_OVERLAYS names this file (`make agent ra`), or by
# default when this package is imported and nothing else was named.
#
# Live web search (DuckDuckGo, then Tavily) and the models `llm.roles` names, sized to stay
# inside the providers' free tiers. Tests inject scripted models and a replayed web.

agent:
  id: research_agent
  version: 0.1.0
  host: research_agent.console:ResearchHost

# This agent's harness. Each key is independently togglable with /harness;
# a withheld feature is a stage that is never built. Sub-features are off
# whenever their parent is. Toggles apply from the *next* run, and the
# effective set is snapshotted into that run's audit record.
features:
  # ra's own features
  scoping_challenge_check: true      # anti-sycophancy guard on interview turns
  gate_encoder: true                 # rules + the local intent classifier before the LLM gate; the LLM is the fallback
  direct_answer:                     # plain questions are answered directly (tools on demand); off = every question starts a scope
    enabled: true
    grounding: true                  # the answer is checked against what its tools returned; unsupported details are removed
  rubric: true                       # acceptance criteria; off = run with no contract items
  reflection: true                   # gap analysis + follow-up queries after each wave
  independent_audit: true               # independent audit of the delivered report
  citation_verification:             # verbatim-span rule + NLI claim support
    enabled: true
    nli: true
  injection_structural: true         # least privilege, exfiltration + source-policy checks
  injection_classifier:              # phrase check over fetched text
    enabled: true
    model: true                      # a hosted injection model adjudicates phrase hits
  quarantined_extractor: true        # only the extractor ever reads raw page text
  # platform features this agent composes: all three screen the person's own message
  pii: true
  prompt_injection: true             # phrase scan + hosted jailbreak model on the user's message
  content_moderation: true           # term scan + hosted safety model on the user's message
  memory:
    enabled: true
    working: true
    episodic: true
    semantic: true
    # Disabled by design: this agent learns nothing procedural across runs.
    procedural: false
  # The platform's context window for the direct answer: working memory and earlier research,
  # ranked, fitted and health-checked. The reranker is a hosted cross-encoder: off by default.
  context:
    enabled: true
    rerank: false
    failure_detection: true
  # Platform features this agent does not compose. Declared false because
  # an overlay cannot delete keys the platform default declares; moving
  # them with /harness changes nothing for this agent (ADR ra-0016).
  basic_sanity: false
  intent_classification: false
  hallucination_guard: false
  gatekeeper: false

logging:
  # This agent's own subsystem, coloured on the console beside the platform's.
  subsystem_colors:
    research_agent: light_goldenrod1

audit:
  policy_version: research-contract-v1
  data_version: live-web-v1
  prompt_version: research-prompts-v1
  tool_schema_version: research-tools-v1
  prompt_source: research_agent/prompts
  policy_source: research contract (audit)

# The research roles' default model and its protection: nemotron-super, backed up by
# nemotron-ultra (strongest, slower) and then gpt-oss-20b (fast, a different family).
x-super-chain: &super_chain
  provider: nim
  model: nvidia/nemotron-3-super-120b-a12b
  timeout_seconds: 60
  hedge_after_seconds: 25
  fallbacks:
    - {provider: nim, model: nvidia/nemotron-3-ultra-550b-a55b}
    - { provider: nim, model: openai/gpt-oss-20b }

llm:
  # Role -> model. `judge` must differ from `synthesizer` while
  # research_agent.audit.independent_judge is true (checked at start-up).
  # Each role's model, its backups and its protection. Every call runs through the platform's
  # resilience stack per model (retry, breaker, `timeout_seconds` per attempt); when a model has
  # not answered after `hedge_after_seconds`, or fails, the next backup starts beside it and the
  # first answer wins (`ModelChainBuilder`). Measured on run-01ff185590 (2026-10-02): 210 of 367 s
  # were stalled calls retried on the same model — the backups exist to end exactly that.
  roles:
    # Thinking off: an interview turn is one short question, and with reasoning on the model
    # spent 600-4,000 hidden tokens (3.5-32s) on it. Measured 2026-10-02 on a scoping prompt:
    # 5.5-9.9s with thinking, 0.5s without, and the questions were as specific.
    interviewer:
      <<: *super_chain
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
    # Thinking off for the structured roles: a plan, an extraction, a gap list are schema-shaped
    # answers; with reasoning on the planner spent 34 s on a two-step plan (run-01ff185590).
    planner:
      <<: *super_chain
      timeout_seconds: 90
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
    researcher: {<<: *super_chain, timeout_seconds: 90}
    extractor:
      <<: *super_chain
      timeout_seconds: 90
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
    reflector:
      <<: *super_chain
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
    synthesizer: {<<: *super_chain, timeout_seconds: 120, hedge_after_seconds: 60}
    # The judge is the strongest model on the account, and a different one from the writer;
    # about 2x slower than gpt-oss-20b at the median (6.0s vs 2.8s per call, measured
    # 2026-10-01). Its backup is gpt-oss-20b: also not the writer.
    judge:
      provider: nim
      model: nvidia/nemotron-3-ultra-550b-a55b
      timeout_seconds: 120
      hedge_after_seconds: 45
      fallbacks: [{provider: nim, model: openai/gpt-oss-20b}]
    # Multi-step tool calling: the model the platform recommends for it.
    answerer: *super_chain

  # The intent classifier's embedder, local: nearest labelled examples need similarity, not a
  # network call per message. e5 expects "query: " before every text it compares.
  local_embedder:
    enabled: true
    model: intfloat/e5-large-v2
    local_model_dir: local_models/embedders/e5-large-v2
    prefixes: {query: "query: ", passage: "query: "}

# The answer's colours beyond light Markdown: what each criterion is, what to do next.
tui:
  response_highlights:
    - {pattern: '^→ Next:.*$', style: "bold green"}
    - {pattern: '\[must\]', style: "bold yellow"}
    - {pattern: '\[soft\]', style: "blue"}
    - {pattern: '^R\d+\b', style: "bold magenta"}
    - {pattern: '(?<![\w/])/(?:research|qa|done|approve|rubric|waive|cancel|show|history|help)\b', style: "bold cyan"}
    - {pattern: '^\(I removed details[^)]*\)$', style: "dim italic"}
    - {pattern: '^\*\*Status:\*\* COMPLETE.*$', style: "bold green"}
    - {pattern: '^\*\*Status:\*\* PARTIAL.*$', style: "bold yellow"}
    - {pattern: '^\*\*Status:\*\* (?:FAILED|CANCELLED).*$', style: "bold red"}
    - {pattern: '^(?:\*\*)?Sources?:?(?:\*\*)?:?', style: "bold magenta"}

# What grounds a claim in a research answer. The platform's tiers are the support agent's
# (a tool result grounds only a fact about the case); here every factual claim in an answer
# is about what the tools returned, so the tool-result tier grounds rule claims too.
hallucination_protection:
  # A research answer is checked by NLI; the lexical fallback (if NLI cannot load) may only
  # support a claim, never remove it.
  uncalibrated_may_refute: false
  # A figure or date found in no evidence is rewritten once from the evidence, then removed.
  repair_direct_refutations: true
  # A research answer's "and" joins items of one fact ("models and agents"); only a contrast
  # or a cause starts a separate claim.
  claim_conjunctions: [but, however, although, because]
  # Only evidence about the same day may contradict a dated claim: a forecast for 3 October is
  # not refuted by the line for 2 October (NLI calls that a contradiction: the numbers differ).
  refute_identifier_pattern: '\b\d{4}-\d{2}-\d{2}\b'
  withheld_reply: "I could not verify an answer from the sources I found. Try again, or use /research for a fuller run."
  tiers:
    - {name: tool_result, kinds: [tool_result], claims: [record, rule], may_refute: true}

web:
  mode: live
  # A dead page costs at most ~20 s here, not a minute: one hung fetch held a reader 17 s and
  # more in run-01ff185590, and other pages are waiting.
  fetch:
    timeout_seconds: 10
    max_attempts: 2

artifacts:
  root: data/research_runs

persistence:
  db_path: data/research_agent.db

durability:
  db_path: data/research_checkpoints.db

memory:
  episodic:
    path: data/research_episodic

security:
  prompt_injection:
    # Fetched pages are attacked in their own idiom: they impersonate the
    # system and the search provider, and they address "AI assistants".
    suspicious_phrases:
      - ignore previous instructions
      - ignore all previous
      - disregard the above
      - you are now
      - system prompt
      - new instructions
      - override your
      - system notice
      - supersedes your instructions
      - note to ai
      - ai research assistant


research_agent:
  title: Research Agent
  placeholder: "Ask a question · /research for deep research · /help"
  # The greeting: one line. Notes (a missing key) follow it only when there are any.
  greeting:
    line: "Ask me anything · /research <question> for an audited deep-research report · /help for commands"
  # What start-up says when the live posture lacks a credential.
  setup:
    missing_model_key: >-
      The model roles {roles} need a key that is not set ({env}). Export it and
      start again.
    no_search_key: >-
      `tavily_api_key` is not set: web search uses DuckDuckGo only (free,
      best effort; no fallback when it finds nothing).

  # The conversational slash commands (typed as /<name>).
  command_names:
    done: done
    waive: waive
    rubric: rubric
    approve: approve
    cancel: cancel
    history: history
    show: show
    rubric_add: add
    rubric_drop: drop
    rubric_set: set
    qa: qa
    research: research

  # Everything the agent says that is not written by a model.
  messages:
    refuse: I can't research that request.
    input_blocked: "I can't act on that message: a safety screen stopped it. Rephrase it and try again."
    reframe: "What would you like?\n{options}\nReply with a number, or rephrase your question."
    reframe_option: '  {number}. {label} — e.g. "{example}"'
    qa_started: "Quick answer: searching the web now (no interview). /research gives a full, audited research run instead."
    qa_followup: "Want more depth? /research runs a full, audited research scope on this question."
    challenge_prefix: "Before we go on: "
    propose_done: "I have enough to plan. Draft plan:\n{plan}"
    plan_step: "Research {part}"
    next_step_marker: "→ Next:"
    next_step_proposed: "→ Next: /done (or reply yes) builds the acceptance criteria · reply with anything else to change the plan"
    next_step_rubric: "→ Next: /approve (or reply yes) starts the research · /rubric add <text> | drop <id> | set <id> threshold=<x> must_pass=<bool> edits it"
    done_choice: "Done — build the acceptance criteria"
    approve_choice: "Approve — start the research"
    rubric_heading: "## Acceptance criteria"
    rubric_line: "{id:<4} {gate} {text}  ({kind}:{check} ≥ {threshold}, weight {weight}, {origin})"
    rubric_must: "[must]"
    rubric_soft: "[soft]"
    turn_cap: "We have reached the interview limit. Still open: {open}. Use /waive <id|all> or /done."
    waived: "Waived: {items}. They will be listed as known unknowns."
    finish_scoping_first: "We are still scoping: answer the question, /waive <id>, or /done."
    rubric_hint: "Edit with /rubric add <text> | drop <id> | set <id> threshold=<x> must_pass=<bool>, or /approve to start."
    rubric_error: "Rubric not changed: {error}"
    approved: "Contract {contract_id} frozen (hash {hash}). Research is starting; /cancel stops it."
    run_busy: A research run is in progress; you can watch it or cancel it (/cancel).
    no_active_run: There is no research run in progress.
    cancel_requested: Cancelling the run; it stops at the next safe point and keeps its checkpoint.
    delivered: "Run {run_id} finished: {status}. {summary}"
    new_scope: Ask a new question to start another scope.
    history_empty: No archived runs yet.
    unknown_run: "No archived run '{run_id}'."
    run_note: "Research run {run_id} finished {status}, on: {topic}. It can be opened with /show {run_id}."
    scope_failed: "Could not continue: {error}. Nothing was lost; ask again, or start over with /research <question>."
    brief_ready: "The Scope Brief is ready (no acceptance criteria: the rubric is withheld). /approve starts the run."

  scoping:
    # When the interviewer proposes to finish without a plan, one step per part of this answer.
    plan_item: criteria
    # Agreeing to a proposal: after the draft plan this closes the interview, in rubric review
    # it approves the criteria and starts the run.
    affirmations:
      - '(?:yes|yeah|yep|ok|okay|sure|done|approve[d]?|go ahead|go|proceed|looks good|lgtm|sounds good|confirm(?:ed)?|perfect|great)[.!]*'
    max_turns: 12
    # The anti-sycophancy guard: at least one challenge or follow-up every K turns.
    challenge_every_k_turns: 3
    checklists_path: src/research_agent/scoping/checklists.yaml
    # First messages that ask for something this agent will not research.
    refuse_patterns:
      - '\b(?:make|build|synthesi[sz]e)\s+(?:a\s+)?(?:bomb|weapon|explosive|nerve agent)\b'
      - '\b(?:dox|home address of)\b'
    # Open-ended requests that need a reframe before they are scopable.
    # Messages with no question in them at all ("tell me about X"): the
    # agent offers the two modes instead of guessing.
    reframe_patterns:
      - '^\s*(?:tell me (?:about|everything)|what about)\b'
    # A message that asks for a research *run* rather than an answer, even
    # when it names no specialised kind: it becomes a `general` Research scope.
    quick_reason: "a plain question is answered directly; /research starts a full research run"
    rule_gate_min_cue_hits: 2
    research_cues: [research, investigate, deep dive, in-depth, report on, study of, analyse, analyze]
    # The reframe menu: one line per mode, each with a question that works.
    reframe_options:
      - mode: qa
        label: "Quick answer (Q&A)"
        example: Important AI news in the last 1 month
        aliases: [qa, q&a, quick, answer, question, news]
      - mode: research
        label: "Research (interview, acceptance criteria, audited report)"
        example: Help me choose a vector database for 10 million documents
        aliases: [research, deep, full, report, choose, compare, map, mapping, verify, check, explain]
    time_window:
      amount_pattern: '(\d+)\s*(day|week|month|year)s?\b'
      relative_pattern: '\b(?:last|past|previous|recent)\s+(day|week|month|year)\b'
      current_pattern: '\b(?:this|current)\s+(day|week|month|year)\b'
      # Only news phrasing: "the market today" means "currently", not one day.
      today_pattern: '\b(?:today|yesterday)(?:''s)?\s+(?:news|headlines|announcements|updates)\b|\b(?:last|past)\s+24\s+hours\b'
      unit_days: {day: 1, week: 7, month: 30, year: 365}
    # Cues for the Research kinds. A question with none of them (and no
    # research cue) is answered directly as Q&A. The live gate is a model;
    # these are its hints, and the demo reference model's whole rule.
    archetype_keywords:
      decision_support: [choose, choosing, decide, which should, compare, versus, " vs ", option, pick, recommend, should we, should i, which is better, better than, alternatives to, trade-off]
      landscape_brief: [landscape, players, market map, who are the, competitors, ecosystem, market, who makes, vendors, startups, map the, overview of the]
      fact_verification: [verify, is it true, fact-check, fact check, claim, confirm whether, check whether, is it accurate, true that, debunk]
      explainer: [explain, primer, understand how, walk me through, teach me]
    # A comma inside a number ("10,000 cycles") does not split an answer.
    answer_split_pattern: '\s*(?:,(?!\d)|;|\band\b)\s*'
    vague_answer_max_words: 3
    absolute_words: [best, always, never, everyone, obviously, perfect]
    waive_all_keyword: all
    any_recency_words: [any, none, no limit]
    # Answers that decline an optional item: the Brief keeps its default.
    none_answers: [any, none, no preference, skip, "n/a", nothing]
    skipped_answer: "n/a"
    primary_sources_phrase: primary
    # What picks a size in the "how big" answer; "N pages" sets the page count itself.
    depth_words:
      small: [small, short, brief, quick, few, concise]
      medium: [medium, moderate, standard, normal]
      large: [large, big, deep, detailed, thorough, extensive, comprehensive, full]
    pages_pattern: '(\d+)\s*(?:pages?|sources?)'

  rubric:
    templates_path: src/research_agent/rubric/templates.yaml

  budget:
    # Defaults and the ceiling: a Brief may lower these, never raise them.
    # Sized for free tiers: at most 8 searches a run (Tavily is only asked
    # when DuckDuckGo cannot answer or the search is time-bounded), and two
    # workers at once against NVIDIA's 35 requests/minute.
    max_searches: 8
    max_fetches: 24
    max_tokens: 200000
    max_seconds: 900
    max_rounds: 3
    max_dag_nodes: 8
    max_gap_fill_rounds: 1
    concurrency: 2

  # How big a run is, chosen in the interview ("small", "medium", "large" or "N pages"); small
  # when unanswered. Each budget is lowered to the ceiling above if it asks for more. The report
  # shows `report_entries` ledger entries, written within `report_max_tokens`.
  depths:
    small:
      budget: {max_searches: 3, max_fetches: 6, max_tokens: 60000, max_seconds: 300, max_rounds: 1, max_dag_nodes: 2, max_gap_fill_rounds: 0, concurrency: 2}
      report_entries: 12
      report_max_tokens: 3072
    medium:
      budget: {max_searches: 5, max_fetches: 12, max_tokens: 120000, max_seconds: 600, max_rounds: 2, max_dag_nodes: 4, max_gap_fill_rounds: 1, concurrency: 2}
      report_entries: 28
      report_max_tokens: 5120
    large:
      budget: {max_searches: 8, max_fetches: 24, max_tokens: 200000, max_seconds: 900, max_rounds: 3, max_dag_nodes: 8, max_gap_fill_rounds: 1, concurrency: 2}
      report_entries: 60
      report_max_tokens: 8192

  # Q&A: a quick cited answer, no interview. Three searches at most (the
  # router asks DuckDuckGo first, Tavily only for news/time-bounded
  # questions or when DuckDuckGo finds nothing), one follow-up round.
  qa:
    budget:
      max_searches: 3
      max_fetches: 8
      max_tokens: 80000
      max_seconds: 300
      max_rounds: 2
      max_dag_nodes: 3
      max_gap_fill_rounds: 0
      concurrency: 2

  planning:
    max_queries_per_node: 2
    node_id_prefix: Q

  # Deterministic coverage matching: stop rules, gap analysis, audit checks.
  matching:
    token_pattern: '[a-z0-9][a-z0-9,/]*'
    stem_chars: 5
    min_token_chars: 3
    stopwords: [the, and, for, with, each, every, per, its, their, this, that, from, into, how, what, which, are, was, were, has, have, does, option, options]
    synonyms:
      cold: [cold, minus, celsius, degrees]
      weather: [minus, celsius, cold]
      cost: [cost, usd, price]
      cycle: [cycle, cycles]
      safety: [flammable, thermal, runaway, ignite, fire, safety, incident]
      recyclability: [recycl]
      approach: [builds, makes, develops, tests, turbines, kites]
      scale: [installed, deployed, operates, units, sites, pilot]
      funding: [raised, funded, round, loan, grant, seed]
      oxidation: [oxidis, oxide, rust, oxygen]
      recharging: [charg, reverses, backwards]
      efficiency: [efficiency]
      duration: [duration, hours, days]
      news: [announced, launched, released, approved, registry, raised]
      important: [announced, launched, released, approved]

  calls:
    # The roles run on a reasoning model: its hidden reasoning counts against the cap,
    # so the default 3000 tokens can leave an empty answer on a long page.
    role_max_tokens:
      # With thinking off a turn's JSON is ~150 tokens; 1024 leaves room for a long plan.
      interviewer: 1024
      planner: 8192
      extractor: 8192
      researcher: 8192
      reflector: 8192
      judge: 8192
      # A long report plus the model's reasoning; `report_max_tokens` bounds what it is asked for.
      synthesizer: 16384
    truncation_retries: 1
    truncation_retry_factor: 2

  research:
    max_results_per_search: 5
    max_fetches_per_node: 4
    max_claims_per_page: 4
    # The relevant windows of a page, not its head: 40,000 characters of navigation and comments
    # took 15-30 s an extraction and stalled (run-01ff185590); 12,000 of the windows that share
    # the sub-question's terms keep what matters.
    extractor_page_chars: 12000
    extractor_window_chars: 1500
    # Pages read at once across the run; the rate limiter still paces the model calls.
    page_concurrency: 4
    # Sources whose host contains one of these count as primary.
    primary_source_markers: [regulator, lab, uni, safety-board, teardowns]
    # A search query or fetch URL must match one of these to leave the process.
    outbound_allow_patterns: ['^https?://', '^[\w\s\-.,/:%''"]+$']
    outbound_deny_patterns: ['(?i)\bcollect\.', '(?i)[?&](?:q|d|data|log)=']
    authority_rank: untrusted_content
    recency_rejection: "outside the approved {days}-day recency window (published {date})"
    undated_policy: verify_on_page
    undated_rejection: "no readable publication date (got '{date}'), so it cannot be shown to fall inside the {days}-day window"
    news_window_days: 31
    # Kinds of source, by host suffix: shown with their label and fetched after the rest.
    source_labels:
      press release: [prnewswire.com, businesswire.com, globenewswire.com, accesswire.com, einpresswire.com]
    news_topic: news
    quota_stop: "search quota for this month is used up (it resets on the 1st)"

  reflection:
    max_followups_per_round: 4
    # Gap-fill follow-ups are numbered from this round, apart from reflection's.
    gap_fill_round_offset: 100

  synthesis:
    citation_pattern: '\[(E\d+)\]'
    entry_id_prefix: E
    templates_path: src/research_agent/synthesis/report_templates.yaml
    max_guard_rewrites: 1

  # The hosted injection model behind the phrase check on fetched pages. A phrase hit is dropped
  # only if the model agrees (score >= threshold); scan_all also scores pages with no phrase hit.
  injection_model:
    threshold: 0.5
    scan_all: false
    window_chars: 2000
    max_windows: 4

  # The intent classifier (nearest labelled examples over the local e5 embedder, `llm.local_embedder`)
  # in front of the LLM scope gate: it decides alone only above both bars.
  gate_encoder:
    min_confidence: 0.80
    min_margin: 0.25

  # The front door. A plain question is answered directly (no scope, no plan, no audit
  # pipeline); only a research request starts a scope. Rules first, then the encoder above,
  # then the LLM for what the encoder is unsure of. Anything left is answered directly.
  intent_router:
    research_cue_min_hits: 1
    # No training: a message is compared with the labelled examples the scope gate already ships
    # (scoping/gate_training.yaml) and the nearest 7 vote. Measured 2026-10-02, leave-one-out over
    # the 88 examples (answer vs research): one bar of 0.70 decided 91% but sent 2 questions to
    # research; answer at 0.70 and research at 0.85 decide 85%, 95% right, 1 question sent to
    # research. "Important AI news on impact of software jobs in the last 3 months" went to
    # research at 0.71 before the news examples were added; it now reads answer at 0.86.
    exemplars_path: src/research_agent/scoping/gate_training.yaml
    neighbours: 7
    min_confidence: 0.7
    research_min_confidence: 0.85
    encoder_answer_labels: [qa, answer]
    llm_fallback: true

  # The direct-answer path: a ReAct loop (THOUGHT -> ACTION -> OBSERVATION -> THOUGHT ...),
  # then the HALLUCINATION CHECK (the answer checked against what the tools returned) and, only if that check
  # objects, one REVISE. The model answers from what it knows and calls a tool when it needs
  # more; the loop ends at the first budget cap, and says which.
  answer:
    role: answerer
    budget:
      max_steps: 6
      max_tool_calls: 4
      max_total_tokens: 30000
      max_seconds: 120
    call_timeout_seconds: 45
    repair_timeout_seconds: 45
    min_call_seconds: 5
    max_tokens: 8192
    temperature: 0.2
    # An answer of three or more sentences written as prose is shown one point per sentence.
    pointwise:
      enabled: true
      marker: "-"
      min_sentences: 3
    search_max_results: 5
    snippet_max_chars: 1200
    fetch_max_chars: 6000
    date_format: "%A, %d %B %Y, %H:%M %Z"
    clock_format: "%A, %d %B %Y, %H:%M:%S %Z (UTC%z)"
    context:
      history_turns: 6
      recall_scan: 50
      recall_limit: 3
      min_word_chars: 4
      # An earlier run is offered only when the question shares this many words with its topic.
      min_overlap: 2
    grounding:
