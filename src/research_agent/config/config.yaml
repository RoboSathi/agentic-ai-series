# The research agent's overlay on the platform defaults (agent_platform).
# Loaded when AGENTIC_OVERLAYS names this file (`make agent ra`), or by
# default when this package is imported and nothing else was named.
#
# Live web search (DuckDuckGo, then Tavily) and the models `llm.roles` names, sized to stay
# inside the providers' free tiers. Tests inject scripted models and a replayed web.

agent:
  id: research_agent
  # How dashboards and reports title this agent.
  display_name: Research Agent
  version: 0.1.0
  host: research_agent.console:ResearchHost

# This agent's harness. Each key is independently togglable with /harness;
# a withheld feature is a stage that is never built. Sub-features are off
# whenever their parent is. Toggles apply from the *next* run, and the
# effective set is snapshotted into that run's audit record.
features:
  # ra's own features
  scoping_challenge_check: true      # anti-sycophancy guard on interview turns
  kind_encoder: true                 # /research kind: cue rules + the local example classifier before the LLM
  direct_answer:                     # plain questions are answered directly (tools on demand); off = every question starts a scope
    enabled: true
    grounding: true                  # the answer is checked against what its tools returned; unsupported details are removed
  rubric: true                       # acceptance criteria; off = run with no contract items
  reflection: true                   # gap analysis + follow-up queries after each batch
  independent_audit: true               # independent audit of the delivered report
  citation_verification:             # verbatim-span rule + NLI claim support
    enabled: true
    nli: true
  injection_structural: true         # least privilege, exfiltration + source-policy checks
  injection_classifier:              # phrase check over fetched text
    enabled: true
    model: true                      # a hosted injection model adjudicates phrase hits
  quarantined_extractor: true        # only the extractor ever reads raw page text
  # platform features this agent composes: all three screen the person's own message
  pii: true
  prompt_injection: true             # phrase scan + hosted jailbreak model on the user's message
  content_moderation: true           # term scan + hosted safety model on the user's message
  memory:
    enabled: true
    working: true
    episodic: true
    semantic: true
    # Not composed (ra-0021): each role's own instructions are its procedure, and a second
    # copy as a skill only cost tokens on every call. The profile goes on the answerer.
    procedural: false
  # The platform's context window for the direct answer: working memory and earlier research,
  # ranked, fitted and health-checked. The reranker is a hosted cross-encoder: off by default.
  context:
    enabled: true
    rerank: false
    failure_detection: true
  # Platform features this agent does not compose. Declared false because
  # an overlay cannot delete keys the platform default declares; moving
  # them with /harness changes nothing for this agent (ADR ra-0016).
  deterministic_checks: false
  intent_classification: false
  hallucination_guard: false
  gatekeeper: false

logging:
  # This agent's own subsystem, coloured on the console beside the platform's.
  subsystem_colors:
    research_agent: light_goldenrod1

# This agent's tasks (ADR 0009 D2, D4): a research run, which spans the scoping
# interview, the run and any stop/resume, and a direct answer, which is one turn.
analytics:
  tasks:
    kinds: [research_run, direct_answer]
    outcomes:
      run_complete: {success: true, terminal: true}
      # A report was delivered, with its gaps stated: the person has an answer.
      run_partial: {success: true, terminal: true}
      run_cancelled: {success: false, terminal: true}
      run_failed: {success: false, terminal: true}
      scope_refused: {success: false, terminal: true}
      answered: {success: true, terminal: true}
      answer_failed: {success: false, terminal: true}
      refused_out_of_scope: {success: false, terminal: true}

audit:
  policy_version: research-contract-v1
  data_version: live-web-v1
  prompt_version: research-prompts-v2
  tool_schema_version: research-tools-v1
  prompt_source: research_agent/prompts
  policy_source: research contract (audit)

# The research roles' default model and its protection: nemotron-ultra (the strongest on the
# account; nemotron-super, the default until 2026-10-03, reached end of life that day), backed up
# by nemotron-lightning (thinking off: with it on it narrates into the answer) and then gpt-oss-20b
# last, so a call always gets some answer. The same line-up as the platform's `llm.chain`.
x-default-chain: &default_chain
  provider: nim
  model: nvidia/nemotron-3-ultra-550b-a55b
  timeout_seconds: 60
  hedge_after_seconds: 25
  fallbacks:
    - provider: nim
      model: nvidia/nemotron-3.5-lightning-30b-a3b
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
    - {provider: nim, model: openai/gpt-oss-20b}

llm:
  # Role -> model. `judge` must differ from `synthesizer` while
  # research_agent.audit.independent_judge is true (checked at start-up).
  # Each role's model, its backups and its protection. Every call runs through the platform's
  # resilience stack per model (retry, breaker, `timeout_seconds` per attempt); when a model has
  # not answered after `hedge_after_seconds`, or fails, the next backup starts beside it and the
  # first answer wins (`ModelChainBuilder`). Measured on run-01ff185590 (2026-10-02): 210 of 367 s
  # were stalled calls retried on the same model — the backups exist to end exactly that.
  roles:
    # Thinking off: an interview turn is one short question, and with reasoning on the model
    # spent 600-4,000 hidden tokens (3.5-32s) on it. Measured 2026-10-02 on a scoping prompt:
    # 5.5-9.9s with thinking, 0.5s without, and the questions were as specific.
    interviewer:
      <<: *default_chain
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
    # Thinking off for the structured roles: a plan, an extraction, a gap list are schema-shaped
    # answers; with reasoning on the planner spent 34 s on a two-step plan (run-01ff185590).
    planner:
      <<: *default_chain
      timeout_seconds: 90
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
    researcher: {<<: *default_chain, timeout_seconds: 90}
    extractor:
      <<: *default_chain
      timeout_seconds: 90
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
    reflector:
      <<: *default_chain
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
    synthesizer: {<<: *default_chain, timeout_seconds: 120, hedge_after_seconds: 60}
    # The judge: the same line-up as the writer since super's retirement (2026-10-03), with a
    # longer limit for grading. It is therefore not independent of the synthesizer, and
    # `research_agent.audit.independent_judge` is off so every audit records that.
    judge: {<<: *default_chain, timeout_seconds: 120, hedge_after_seconds: 45}
    # Multi-step tool calling: the model the platform recommends for it.
    answerer: *default_chain

  # The intent classifier's embedder, local: nearest labelled examples need similarity, not a
  # network call per message. e5 expects "query: " before every text it compares.
  local_embedder:
    enabled: true
    model: intfloat/e5-large-v2
    local_model_dir: local_models/embedders/e5-large-v2
    prefixes: {query: "query: ", passage: "query: "}

# The answer's colours beyond light Markdown: what each criterion is, what to do next.
tui:
  response_highlights:
    - { pattern: '^→ Next:.*$', style: "bold #D6B978" }
    - { pattern: '\[must\]', style: "bold #B8945A" }
    - { pattern: '\[soft\]', style: "#A89F8F" }
    - { pattern: '^R\d+\b', style: "bold #E2C792" }
    - { pattern: '(?<![\w/])/(?:research|done|approve|rubric|waive|cancel|show|history|help)\b', style: "bold #B8945A" }
    - { pattern: '^\(I removed details[^)]*\)$', style: "italic #8A8A8A" }
    - { pattern: '^\*\*Status:\*\* COMPLETE.*$', style: "bold #59F06A" }
    - { pattern: '^\*\*Status:\*\* PARTIAL.*$', style: "bold #F4D35E" }
    - { pattern: '^\*\*Status:\*\* (?:FAILED|CANCELLED).*$', style: "bold #FF5C5C" }
    - { pattern: '^(?:\*\*)?Sources?:?(?:\*\*)?:?', style: "bold #D6B978" }

# What grounds a claim in a research answer. The platform's tiers are the support agent's
# (a tool result grounds only a fact about the case); here every factual claim in an answer
# is about what the tools returned, so the tool-result tier grounds rule claims too.
hallucination_check:
  # A research answer is checked by NLI; the lexical fallback (if NLI cannot load) may only
  # support a claim, never remove it.
  uncalibrated_may_refute: false
  # A figure or date found in no evidence is rewritten once from the evidence, then removed.
  repair_direct_refutations: true
  # A research answer's "and" joins items of one fact ("models and agents"); only a contrast
  # or a cause starts a separate claim.
  claim_conjunctions: [but, however, although, because]
  # Only evidence about the same day may contradict a dated claim: a forecast for 3 October is
  # not refuted by the line for 2 October (NLI calls that a contradiction: the numbers differ).
  refute_identifier_pattern: '\b\d{4}-\d{2}-\d{2}\b'
  withheld_reply: "I could not verify an answer from the sources I found. Try again, or use /research for a fuller run."
  # A web page states one fact across short lines (a name, then a title, then a past role):
  # four consecutive sentences of a result are also one premise, and an undecided claim gets
  # its source's relevant lines joined. Both support only.
  passage_window: 4
  tool_results_are_pages: true
  joined_premise:
    enabled: true
    max_chars: 1500
  embedding_top_k: 6
  # NLI cannot confirm a sentence that joins several of a page's lines ("Kumar Karan, a former
  # Engineering Manager at Turing and Lead Instructor at Scaler"): no one line states it. A
  # local decision model reads the claim beside the page's own text and may confirm it; it never
  # refutes. Measured 2026-10-10 on the RoboSathi turn, as the resolver asks it: true claims
  # 0.48-0.63 "supported" (its choice), invented ones 0.30-0.31 (its choice "not stated"), so
  # the platform's 0.45 bar sits in the gap. Wrong relations and figures stay NLI's to refute.
  confirmer:
    enabled: true
    model: convaiinnovations/laya
    subfolder: typed-decisions
    local_model_dir: local_models/intent_classifier/laya-typed-decisions
  # A claim the sources neither confirm nor contradict stays, marked for the reader.
  undetermined_marker: " (unverified)"
  tiers:
    - {name: tool_result, kinds: [tool_result], claims: [record, rule], may_refute: true}

web:
  mode: live
  # A dead page costs at most ~20 s here, not a minute: one hung fetch held a reader 17 s and
  # more in run-01ff185590, and other pages are waiting.
  fetch:
    timeout_seconds: 10
    max_attempts: 2

artifacts:
  root: src/research_agent/data/runs

persistence:
  db_path: src/research_agent/db/agent.db

durability:
  db_path: src/research_agent/db/checkpoints.db

memory:
  episodic:
    path: logs/memory/research_agent

security:
  prompt_injection:
    # Fetched pages are attacked in their own idiom: they impersonate the
    # system and the search provider, and they address "AI assistants".
    suspicious_phrases:
      - ignore previous instructions
      - ignore all previous
      - disregard the above
      - you are now
      - system prompt
      - new instructions
      - override your
      - system notice
      - supersedes your instructions
      - note to ai
      - ai research assistant
  content_moderation:
    # A research assistant, not a support desk: questions about people, places, companies,
    # history and current events — and about the user's own details — are ordinary here.
    system_prompt: |
      You are a content-safety classifier for a research assistant that answers questions and
      researches topics on the web.
      Classify only the latest user message. Return JSON and nothing else.
      Schema: {"User Safety":"safe"|"unsafe","Safety Categories":"comma-separated categories"}.
      Omit Safety Categories when the message is safe. Questions about people, places,
      organisations, history, science, news and current events are safe, as are questions about
      the user's own account or details.


# What the model and every card call each answer tool (ADR 0010).
tools:
  model_names:
    answer.web_search: web_search
    answer.fetch_url: read_page
    answer.current_datetime: current_time
    answer.weather: weather

# The profile and the procedures (ADR 0010, ra-0021).
skills:
  profile_path: src/research_agent/prompts/AGENT.md

research_agent:
  # Which roles are prompted with the agent profile, and how a role is written as a
  # procedure signal. Only the direct answer: every run role's own instructions already say
  # all it needs, and the profile on top only cost tokens on each call (ra-0021).
  instructions:
    profile_roles: [answerer]
    role_signal: "role:{role}"
  tasks:
    research_run: research_run
    direct_answer: direct_answer
    run_status: {COMPLETE: run_complete, PARTIAL: run_partial, CANCELLED: run_cancelled, FAILED: run_failed}
    scope_refused: scope_refused
    answered: answered
    answer_failed: answer_failed
    refused: refused_out_of_scope
  title: Research Agent
  placeholder: "Ask a question · /research for deep research · /help"
  # The greeting: one line. Notes (a missing key) follow it only when there are any.
  greeting:
    line: "\nAsk me anything · /research <question> for an audited deep-research report · /help for commands"
  # What start-up says when the live posture lacks a credential.
  setup:
    missing_model_key: >-
      The model roles {roles} need a key that is not set ({env}). Export it and
      start again.
    no_search_key: >-
      `tavily_api_key` is not set: web search uses DuckDuckGo only (free,
      best effort; no fallback when it finds nothing).

  # The conversational slash commands (typed as /<name>).
  command_names:
    done: done
    waive: waive
    rubric: rubric
    approve: approve
    cancel: cancel
    history: history
    show: show
    rubric_add: add
    rubric_drop: drop
    rubric_set: set
    research: research

  # Everything the agent says that is not written by a model.
  # The TURN SUMMARY card that ends every turn, as csa's does: what the turn
  # left the session doing, read from its phase.
  turn_summary:
    outcomes:
      DELIVERED: answered
      SCOPING: interviewing
      RUBRIC_REVIEW: waiting for rubric approval
      RUNNING: research running
      AUDITING: research running
      STOPPED: stopped
      CANCELLED: cancelled
      FAILED: failed
    waiting: [SCOPING, RUBRIC_REVIEW]
    failed: [FAILED]
    crashed: failed
  messages:
    refuse: I can't research that request.
    challenge_prefix: "Before we go on: "
    propose_done: "I have enough to plan. Draft plan:\n{plan}"
    plan_step: "Research {part}"
    next_step_marker: "→ Next:"
    next_step_proposed: "→ Next: /done (or reply yes) builds the acceptance criteria · reply with anything else to change the plan"
    next_step_rubric: "→ Next: /approve (or reply yes) starts the research · /rubric add <text> | drop <id> | set <id> threshold=<x> must_pass=<bool> edits it"
    done_choice: "Done — build the acceptance criteria"
    approve_choice: "Approve — start the research"
    rubric_heading: "## Acceptance criteria"
    rubric_line: "{id:<4} {gate} {text}  ({kind}:{check} ≥ {threshold}, weight {weight}, {origin})"
    rubric_must: "[must]"
    rubric_soft: "[soft]"
    turn_cap: "We have reached the interview limit. Still open: {open}. Use /waive <id|all> or /done."
    waived: "Waived: {items}. They will be listed as known unknowns."
    finish_scoping_first: "We are still scoping: answer the question, /waive <id>, or /done."
    rubric_hint: "Edit with /rubric add <text> | drop <id> | set <id> threshold=<x> must_pass=<bool>, or /approve to start."
    rubric_error: "Rubric not changed: {error}"
    approved: "Contract {contract_id} frozen (hash {hash}). Research is starting; /cancel stops it."
    run_busy: A research run is in progress; you can watch it or cancel it (/cancel).
    no_active_run: There is no research run in progress.
    cancel_requested: Cancelling the run; it stops at the next safe point and keeps its checkpoint.
    delivered: "Run {run_id} finished: {status}. {summary}"
    new_scope: Ask a new question to start another scope.
    history_empty: No archived runs yet.
    unknown_run: "No archived run '{run_id}'."
    run_note: "Research run {run_id} finished {status}, on: {topic}. It can be opened with /show {run_id}."
    scope_failed: "Could not continue: {error}. Nothing was lost; ask again, or start over with /research <question>."
    brief_ready: "The Scope Brief is ready (no acceptance criteria: the rubric is withheld). /approve starts the run."

  scoping:
    # When the interviewer proposes to finish without a plan, one step per part of this answer.
    plan_item: criteria
    # Agreeing to a proposal: after the draft plan this closes the interview, in rubric review
    # it approves the criteria and starts the run.
    affirmations:
      - '(?:yes|yeah|yep|ok|okay|sure|done|approve[d]?|go ahead|go|proceed|looks good|lgtm|sounds good|confirm(?:ed)?|perfect|great)[.!]*'
    max_turns: 12
    # The anti-sycophancy guard: at least one challenge or follow-up every K turns.
    challenge_every_k_turns: 3
    checklists_path: src/research_agent/scoping/checklists.yaml
    # Requests this agent refuses, before any model is asked: a plain question or a /research one.
    refuse_patterns:
      - '\b(?:make|build|synthesi[sz]e)\s+(?:a\s+)?(?:bomb|weapon|explosive|nerve agent)\b'
      - '\b(?:dox|home address of)\b'
    # The cue rules name a research kind only when at least this many of its cues appear (and no
    # other kind ties it); otherwise the encoder, then the LLM.
    kind_rule_min_cue_hits: 2
    time_window:
      amount_pattern: '(\d+)\s*(day|week|month|year)s?\b'
      relative_pattern: '\b(?:last|past|previous|recent)\s+(day|week|month|year)\b'
      current_pattern: '\b(?:this|current)\s+(day|week|month|year)\b'
      # Only news phrasing: "the market today" means "currently", not one day.
      today_pattern: '\b(?:today|yesterday)(?:''s)?\s+(?:news|headlines|announcements|updates)\b|\b(?:last|past)\s+24\s+hours\b'
      unit_days: {day: 1, week: 7, month: 30, year: 365}
      unit_months: {month: 1, year: 12}
    # Cues for the research kinds: the cue rules' whole vocabulary, and hints for the LLM.
    archetype_keywords:
      decision_support: [choose, choosing, decide, which should, compare, versus, " vs ", option, pick, recommend, should we, should i, which is better, better than, alternatives to, trade-off]
      landscape_brief: [landscape, players, market map, who are the, competitors, ecosystem, market, who makes, vendors, startups, map the, overview of the]
      fact_verification: [verify, is it true, fact-check, fact check, claim, confirm whether, check whether, is it accurate, true that, debunk]
      explainer: [explain, primer, understand how, walk me through, teach me]
    # A comma inside a number ("10,000 cycles") does not split an answer.
    answer_split_pattern: '\s*(?:,(?!\d)|;|\band\b)\s*'
    vague_answer_max_words: 3
    absolute_words: [best, always, never, everyone, obviously, perfect]
    waive_all_keyword: all
    any_recency_words: [any, none, no limit]
    # Answers that decline an optional item: the Brief keeps its default.
    none_answers: [any, none, no preference, skip, "n/a", nothing]
    skipped_answer: "n/a"
    primary_sources_phrase: primary
    # What picks a size in the "how big" answer; "N pages" sets the page count itself.
    depth_words:
      small: [small, short, brief, quick, few, concise]
      medium: [medium, moderate, standard, normal]
      large: [large, big, deep, detailed, thorough, extensive, comprehensive, full]
    pages_pattern: '(\d+)\s*(?:pages?|sources?)'

  rubric:
    templates_path: src/research_agent/rubric/templates.yaml

  budget:
    # Defaults and the ceiling: a Brief may lower these, never raise them.
    # Sized for free tiers: at most 8 searches a run (Tavily is only asked
    # when DuckDuckGo cannot answer or the search is time-bounded), and two
    # workers at once against NVIDIA's 35 requests/minute.
    max_searches: 8
    max_fetches: 24
    max_tokens: 200000
    max_seconds: 900
    max_rounds: 3
    max_dag_nodes: 8
    max_gap_fill_rounds: 1
    concurrency: 2

  # How big a run is, chosen in the interview ("small", "medium", "large" or "N pages"); small
  # when unanswered. Each budget is lowered to the ceiling above if it asks for more. The report
  # shows `report_entries` ledger entries, written within `report_max_tokens`.
  depths:
    small:
      budget: {max_searches: 3, max_fetches: 6, max_tokens: 60000, max_seconds: 300, max_rounds: 1, max_dag_nodes: 2, max_gap_fill_rounds: 0, concurrency: 2}
      report_entries: 12
      report_max_tokens: 3072
    medium:
      budget: {max_searches: 5, max_fetches: 12, max_tokens: 120000, max_seconds: 600, max_rounds: 2, max_dag_nodes: 4, max_gap_fill_rounds: 1, concurrency: 2}
      report_entries: 28
      report_max_tokens: 5120
    large:
      budget: {max_searches: 8, max_fetches: 24, max_tokens: 200000, max_seconds: 900, max_rounds: 3, max_dag_nodes: 8, max_gap_fill_rounds: 1, concurrency: 2}
      report_entries: 60
      report_max_tokens: 8192

  planning:
    max_queries_per_node: 2
    node_id_prefix: Q

  # Deterministic coverage matching: stop rules, gap analysis, audit checks.
  matching:
    token_pattern: '[a-z0-9][a-z0-9,/]*'
    stem_chars: 5
    min_token_chars: 3
    stopwords: [the, and, for, with, each, every, per, its, their, this, that, from, into, how, what, which, are, was, were, has, have, does, option, options]
    synonyms:
      cold: [cold, minus, celsius, degrees]
      weather: [minus, celsius, cold]
      cost: [cost, usd, price]
      cycle: [cycle, cycles]
      safety: [flammable, thermal, runaway, ignite, fire, safety, incident]
      recyclability: [recycl]
      approach: [builds, makes, develops, tests, turbines, kites]
      scale: [installed, deployed, operates, units, sites, pilot]
      funding: [raised, funded, round, loan, grant, seed]
      oxidation: [oxidis, oxide, rust, oxygen]
      recharging: [charg, reverses, backwards]
      efficiency: [efficiency]
      duration: [duration, hours, days]
      news: [announced, launched, released, approved, registry, raised]
      important: [announced, launched, released, approved]

  # LOOP CONTROL for a research run (graph/run_loop.py): where each round goes next, and why.
  # A `because` not listed here is the reflector's own stop sentence, shown as written.
  run_loop:
    next:
      batch_start: research another round
      synthesize: write the report
      gap_fill: fill the audit's gaps
      finalize: finish the run
    because:
      another_round: the reflector planned follow-ups and the budget allows them
      cancelled: the run was stopped
      no_gaps: the audit found no must-pass gaps
      gap_fill_exhausted: must-pass gaps remain but no gap-fill round is left
      budget_spent: must-pass gaps remain but a budget is spent
      reflection_off: must-pass gaps remain but reflection is withheld
      gaps_to_fill: the audit found must-pass gaps and a gap-fill round is left
      gap_fill_planned: follow-ups were planned for the gaps
      no_follow_up: no follow-up fits what is left
      rescue: nothing was admitted, so one rescue round searches again without the time window

  calls:
    # The roles run on a reasoning model: its hidden reasoning counts against the cap,
    # so the default 3000 tokens can leave an empty answer on a long page.
    role_max_tokens:
      # With thinking off a turn's JSON is ~150 tokens; 1024 leaves room for a long plan.
      interviewer: 1024
      planner: 8192
      extractor: 8192
      researcher: 8192
      reflector: 8192
      judge: 8192
      # A long report plus the model's reasoning; `report_max_tokens` bounds what it is asked for.
      synthesizer: 16384
    truncation_retries: 1
    truncation_retry_factor: 2

  research:
    max_results_per_search: 5
    max_fetches_per_node: 4
    max_claims_per_page: 4
    # The relevant windows of a page, not its head: 40,000 characters of navigation and comments
    # took 15-30 s an extraction and stalled (run-01ff185590); 12,000 of the windows that share
    # the sub-question's terms keep what matters.
    extractor_page_chars: 12000
    extractor_window_chars: 1500
    # Pages read at once across the run; the rate limiter still paces the model calls.
    page_concurrency: 4
    # Sources whose host contains one of these count as primary.
    primary_source_markers: [regulator, lab, uni, safety-board, teardowns]
    # A search query or fetch URL must match one of these to leave the process.
    outbound_allow_patterns: ['^https?://', '^[\w\s\-.,/:%''"]+$']
    outbound_deny_patterns: ['(?i)\bcollect\.', '(?i)[?&](?:q|d|data|log)=']
    authority_rank: untrusted_content
    recency_rejection: "outside the approved {days}-day recency window (published {date})"
    undated_policy: verify_on_page
    undated_rejection: "no readable publication date (got '{date}'), so it cannot be shown to fall inside the {days}-day window"
    news_window_days: 31
    # Kinds of source, by host suffix: shown with their label and fetched after the rest.
    source_labels:
      press release: [prnewswire.com, businesswire.com, globenewswire.com, accesswire.com, einpresswire.com]
    news_topic: news
    quota_stop: "search quota for this month is used up (it resets on the 1st)"
    # A page that was blocked, paywalled or unreadable is not nothing: the search engine's
    # snippet of it is the page's own words. Each snippet sentence becomes an entry, under the
    # verbatim rule against the snippet, labelled so the report says how little it rests on.
    snippet_evidence:
      enabled: true
      codes: [blocked, error, empty, unreadable]
      min_words: 6
      caveat: search snippet only (the page itself could not be read)
    # A run whose ledger is still empty when it would stop gets one more round, granted on top
    # of its size: the plan's sub-questions searched again without the time window, and what
    # falls outside the window admitted with a caveat instead of rejected. Still empty at the
    # end, the report is written from the search results themselves, as a best effort.
    rescue:
      enabled: true
      searches: 2
      fetches: 4
      outside_window: "outside the approved {days}-day window (published {date})"
      undated: "no readable date, so not shown to be inside the {days}-day window"
      best_effort_caveat: search result only (nothing could be admitted from the pages)
      best_effort_note: "Best effort: nothing could be established from the pages this run read, so this summary rests on search results alone. Treat it as a starting point, not a finding."

  reflection:
    max_followups_per_round: 4
    # Gap-fill follow-ups are numbered from this round, apart from reflection's.
    gap_fill_round_offset: 100

  synthesis:
    citation_pattern: '\[(E\d+)\]'
    entry_id_prefix: E
    templates_path: src/research_agent/synthesis/report_templates.yaml
    max_guard_rewrites: 1

  # The hosted injection model behind the phrase check on fetched pages. A phrase hit is dropped
  # only if the model agrees (score >= threshold); scan_all also scores pages with no phrase hit.
  injection_model:
    threshold: 0.5
    scan_all: false
    window_chars: 2000
    max_windows: 4

  # Which kind of research a `/research` question asks for: cue rules, then the nearest labelled
  # examples over the local e5 embedder (`llm.local_embedder`), then the LLM. The examples are
  # this agent's own data (scoping/kind_examples.yaml); the nearest 7 vote, and the vote decides
  # alone only above both bars.
  kind_encoder:
    exemplars_path: src/research_agent/scoping/kind_examples.yaml
    neighbours: 7
    min_confidence: 0.80
    min_margin: 0.25

  # The direct-answer path: a ReAct loop (THOUGHT -> ACTION -> OBSERVATION -> THOUGHT ...),
  # then the HALLUCINATION CHECK (the answer checked against what the tools returned) and, only if that check
  # objects, one REVISE. The model answers from what it knows and calls a tool when it needs
  # more; the loop ends at the first budget cap, and says which.
  answer:
    role: answerer
    budget:
      max_steps: 6
      max_tool_calls: 4
      max_total_tokens: 30000
      max_seconds: 120
    call_timeout_seconds: 45
    repair_timeout_seconds: 45
    min_call_seconds: 5
    # The last step is asked for text this many times; a model that still asks for a tool is
    # then asked to answer from the tool results alone, so a found answer is never dropped.
    final_attempts: 2
    max_tokens: 8192
    temperature: 0.2
    # An answer of three or more sentences written as prose is shown one point per sentence.
    pointwise:
      enabled: true
      marker: "-"
      min_sentences: 3
    search_max_results: 5
    snippet_max_chars: 1200
    fetch_max_chars: 6000
    # One slow site held a quick answer 20 s (olympics.com, 2026-10-04): the answer path fetches
    # with its own, shorter limits; a page it gives up on is one of several results.
    fetch_timeout_seconds: 8
    fetch_max_attempts: 1
    # Each answer tool runs through the platform Executor under this deadline.
    tool_timeout_seconds: 30
    date_format: "%A, %d %B %Y, %H:%M %Z"
    clock_format: "%A, %d %B %Y, %H:%M:%S %Z (UTC%z)"
    context:
      history_turns: 6
      recall_scan: 50
      recall_limit: 3
      min_word_chars: 4
      # An earlier run is offered only when the question shares this many words with its topic.
      min_overlap: 2
    grounding:
      entity_pattern: "\\b(?:[A-Z][\\w'-]+\\s+)+[A-Z][\\w'-]+\\b"
      name_unknown_share: 0.5
      sources_pattern: "(?im)^\\s*(?:\\*\\*)?sources?(?:\\*\\*)?\\s*:"
      repair_evidence_per_claim: 3
      # An answer written from search snippets is checked against the pages it cites: up to
      # this many cited pages the loop never fetched are read in full first.
      cited_fetch_max: 3
      cited_fetch_seconds: 10
    weather:
      geocode_url: https://geocoding-api.open-meteo.com/v1/search
      forecast_url: https://api.open-meteo.com/v1/forecast
      timeout_seconds: 15
      geocode_results: 1
      forecast_days: 3
      current_fields: [temperature_2m, apparent_temperature, relative_humidity_2m, precipitation, wind_speed_10m, weather_code]
      daily_fields: [weather_code, temperature_2m_max, temperature_2m_min, precipitation_probability_max]
      codes:
        0: clear sky
        1: mainly clear
        2: partly cloudy
        3: overcast
        45: fog
        48: rime fog
        51: light drizzle
        53: drizzle
        55: dense drizzle
        61: light rain
        63: rain
        65: heavy rain
        71: light snow
        73: snow
        75: heavy snow
        80: rain showers
        81: heavy rain showers
        82: violent rain showers
        95: thunderstorm
        96: thunderstorm with hail
        99: severe thunderstorm with hail
      unknown_code: unclassified conditions
      field_labels:
        temperature_2m: temperature
        apparent_temperature: feels like
        relative_humidity_2m: humidity
        precipitation: precipitation
        wind_speed_10m: wind speed
        temperature_2m_max: high
        temperature_2m_min: low
        precipitation_probability_max: chance of precipitation
    messages:
      cap_reached: "(I stopped at my {counter} limit, so this is the best answer from what I found.)"
      failed: "Could not answer: {cause} (step {step}, {seconds:.0f}s). Try again, or use /research."
      model_timeout: "the model did not respond within {seconds:.0f}s"
      empty: "I could not form an answer. Try rephrasing, or use /research for a fuller run."
      unknown_tool: "There is no tool called '{tool}'."
      bad_arguments: "The arguments for '{tool}' were not valid."
      tool_failed: "'{tool}' failed: {error}"
      loop_step_detail: "{step} of {max} (thought → action → observation)"
      # LOOP CONTROL (the platform card): where the loop goes next, and why. `because` keys are
      # the budget counter that forced the step; the rest are the platform's own reasons.
      loop_next:
        act: run the tools
        ground: check the answer
        final: answer without tools
        reason: think again
        finalize: give the answer
      loop_because:
        seconds: too little time is left for another model call
        tokens: the token budget is spent
        steps: this is the last step
        tool_calls: the tool-call budget is spent
      thought_waiting: "waiting for the {role}…"
      thought_tools: "decided to call {calls} · {tokens} tokens · {seconds:.1f}s"
      thought_answer: "ready to answer · {tokens} tokens · {seconds:.1f}s"
      revise_heading: "rewrote the answer without {claims} unsupported claim(s) · {tokens} tokens · {seconds:.1f}s"
      tool_call: "{tool}({arguments})"
      observation_heading: "{tool} · {lines} line(s) returned"
      observation_failed: "{tool} · {error}"
      answered: "Answered · {steps} step(s) · {calls} tool call(s) · {tokens} tokens · {seconds:.1f}s"
      no_results: "No results."
      sources_heading: "Sources:"
      retrieved: "Retrieved {when}"
      published: "Published {date}"
      grounded_heading: "Checked against the sources · {tally}"
      ungrounded_heading: "Checked against the sources · {removed} unsupported detail(s) removed · {tally}"
      outcome_unchanged: "PASSED · answer sent unchanged"
      outcome_repaired: "PASSED after a rewrite · the rewritten answer was sent"
      outcome_filtered: "TRIMMED · unsupported sentences removed before sending"
      outcome_withheld: "BLOCKED · nothing in the answer could be verified · answer withheld"
      outcome_marked: "PASSED · {count} sentence(s) the sources neither confirm nor contradict marked (unverified)"
      marked_heading: "Checked against the sources · {count} marked unverified · {tally}"
      filtered_note: "(I removed details I could not verify against the sources.)"
      withheld: "I could not verify an answer from the sources I found. Try again, or use /research for a fuller run."
      session_state_heading: "# Session state"
      state_line: "- {key}: {value}"
      earlier_heading: "# Earlier research in this workspace (pointers, not facts)"
      earlier_line: "- {run_id} · {status} · {topic} (open it with /show {run_id})"
      context_turns: "{turns} earlier turn(s) of this conversation"
      context_runs: "earlier research offered as pointers: {runs}"
      unknown_timezone: "unknown timezone '{timezone}'"
      no_place: "no place found for '{location}'"
      page_unreadable: "could not read the page (HTTP {status})"
      page_withheld: "the page was withheld: {why}"
      weather_header: "Weather for {where} (source: {url}), as of {time}"
      weather_now: "Now: {conditions}"
      weather_day: "{day}: {conditions}"

  # An undated question asks for the latest. The model is told so in its prompt, and this check
  # holds it to that: a search pinned to a past year the question never named, or results that
  # are all old, get a note the model reads before it answers. A dated question is left alone.
  recency:
    enabled: true
    year_pattern: '\b(?:19|20)\d{2}\b'
    stale_after_days: 365
    messages:
      pinned: >-
        Note: this search is pinned to {years}, which the question did not ask for. Today is
        {today}, and a question that names no date asks for the latest. Search again without
        that year (or for {current}) before answering.
      stale: >-
        Note: the newest dated result here is from {newest}; today is {today}. A question that
        names no date asks for the latest: if the answer can have changed since, search for
        newer coverage before answering.
      outside_period: "This query names {years}, before the approved period {start} → {end}."
  # The reply shows numbered sources and one finding per line; the archive keeps evidence ids.
  reader_view: true
  reader_view_wording:
    status_line: "**Status:** {status} · {count} {noun}"
    source_singular: source
    source_plural: sources
    no_evidence: No usable evidence was found.
    sources_heading: "## Sources"
    source_line: "[{number}] {host}{label} — {url} — retrieved {date}"
    unknown_date: "?"
    not_established_heading: "## Not established"
    not_established_line: "- {text} Tried: {tried}."
    nothing_tried: nothing
    stopped_early: "- Stopped early: {note}."
    not_read: "**Not read:** {hosts}{more}"
    more_hosts: ", +{count} more"
    max_not_read: 8
    reasons:
      recency: outside the date window
      undated: no readable date
      blocked: blocked or paywalled
      dead_link: not found
      error: could not be fetched
      empty: no readable text
      injection: flagged as unsafe
    not_used: not used

  audit:
    # When true, `judge` must resolve to a different model than `synthesizer`. Off since
    # 2026-10-03: with nemotron-super retired, both run on nemotron-ultra (the account's strongest
    # model). Recorded on every audit result, so a report never claims an independence it lacks.
    independent_judge: false
    # lexical: deterministic (what tests inject); platform: the configured NLI
    # cross-encoder.
    entailment_model: platform
    entity_pattern: '\b[A-Z][a-z]+(?:\s+[A-Z][a-z]+)+\b'
    # Verdict: the weighted score (criterion weights in rubric/templates.yaml) needs
    # `pass_threshold` for a PASS; below `partial_threshold` it FAILs; between, PARTIAL.
    # A failed must-pass criterion is a veto: never a PASS, whatever the score.
    pass_threshold: 0.8
    partial_threshold: 0.5

  archive:
    # Off: the episodic index row is the run pointer. On: also file it as a semantic fact.
    semantic_pointer: false
    run_id_prefix: run
    history_limit: 20
    list_headers: [run, status, archetype, topic, unmet, intact]
    list_empty: No archived research runs yet — finish a run in `make agent ra`.

  cancel:
    key: ctrl+x

  tui:
    stage_labels:
      research_kind: RESEARCH KIND
      hallucination_check: HALLUCINATION CHECK
      llm_call_interviewer: INTERVIEWER
      llm_call_planner: PLANNER
      llm_call_researcher: READING A PAGE
      llm_call_extractor: EXTRACTOR
      llm_call_reflector: REFLECTING
      llm_call_synthesizer: WRITING THE REPORT
      llm_call_judge: JUDGE
      llm_call_answerer: ANSWERING
      interview_turn: INTERVIEW
      coverage_update: WAIVER
      rubric_generate: RUBRIC
      plan_dag: PLAN
      batch_start: RESEARCH BATCH
      worker_search: SEARCH
      worker_fetch: FETCH
      content_defense: CONTENT DEFENCE
      reflect_gap_analysis: REFLECT
      budget_tick: BUDGET
      page_result: EXTRACT
      batch_summary: BATCH RESULT
      synthesize: SYNTHESIZE
      citation_guard: HALLUCINATION CHECK · REPORT
      independent_audit: LLM JUDGE
      gap_fill: GAP FILL
      finalize: FINAL STATUS
    command_help:
      research: "Full research run on a question — interview, criteria, audit (/research [question]; bare = the last question)"
      done: "End the interview now; open required items become known unknowns"
      waive: "Waive an open checklist item (/waive <id> or /waive all)"
      rubric: "Edit acceptance criteria: add <text> | drop <id> | set <id> threshold=<x> must_pass=<bool>"
      approve: "Freeze the Research Contract and start the autonomous run"
      cancel: "Cancel the research run in progress (checkpoint kept)"
      history: "Archived research runs (the episodic run index)"
      show: "Show an archived run's report"
    history_headers: [run, status, archetype, topic, unmet]
    clip_chars: 110
    budget_headline: [searches, fetches]
    quiet_budget_counters: [rounds, gap_fill_rounds]
    actions:
      SCOPING:
        - {label: "✓ Done Interviewing", command: done, variant: primary}
      RUBRIC_REVIEW:
        - {label: "▶ Approve & Run", command: approve, variant: success}
      # RUNNING / STOPPED: the platform's run buttons (`tui.run_controls`), the same as every agent.
    phase_colors:
      SCOPING: "bold #D6B978"
      RUBRIC_REVIEW: "bold #E2C792"
      RUNNING: "bold #59F06A"
      AUDITING: "bold #F4D35E"
      STOPPED: "bold #F4D35E"
      DELIVERED: "bold #59F06A"
      CANCELLED: "bold #FF5C5C"
      FAILED: "bold #FF5C5C"

    status_line_styles:
      coverage: "#D6B978"
      evidence: "#E2C792"
      budget: "#8A8A8A"

    checklist_styles:
      covered: "#59F06A"
      waived: "#F4D35E"
      open: "#8A8A8A"
    # Rejection and gap codes, in words.
    reasons:
      recency: results older than the approved time window
      undated: results with no readable publication date
      dead_link: dead links
      blocked: pages that block or paywall readers
      empty: pages with no readable text
      error: pages that failed to load
      injection: pages carrying hidden instructions (dropped)
      unreadable: pages the model could not read
      other: other reasons
      EMPTY_SPAN: the quoted passage was empty
      SOURCE_UNKNOWN: the page was not one the run fetched
      SOURCE_HASH_MISMATCH: the page changed after it was read
      SPAN_NOT_VERBATIM: the quote does not appear word-for-word on the page
    # Every sentence a card or the status block says. Placeholders are filled by the card.
    cards:
      classifier.rule: "a deterministic rule"
      classifier.encoder: the example classifier
      classifier.llm: the LLM
