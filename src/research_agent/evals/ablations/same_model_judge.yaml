# Ablation: the Goldfish Audit's judge is the model that wrote the report.
# Independence has to be switched off too — otherwise start-up refuses the
# collision, which is the point of the check.
llm:
  roles:
    judge:
      provider: nim
      model: nvidia/nemotron-3-super-120b-a12b
research_agent:
  audit:
    independent_judge: false
