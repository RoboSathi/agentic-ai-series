# Where the research agent uses each pattern (read by `make patterns`).
# `patterns` names catalogue patterns (design_patterns/catalogue.py);
# `other` names the LLD and resilience patterns this agent applies.
agent: research_agent
patterns:
  - pattern: router
    where: scoping/kind.py · research_kind node
    notes: a /research question is routed to its research kind (cue rules, then the example classifier, then the LLM) or refused; the kind picks the checklist, rubric, stop rule and report
  - pattern: human_in_the_loop
    where: graph/scoping_graph.py · await_user (durability/hitl.await_decision)
    notes: the interview and rubric review pause the durable graph until the user answers; /approve freezes the contract
  - pattern: planning
    where: planning/planner.py + planning/dag_validation.py · plan_dag (with its validation)
    notes: the planner decomposes the contract into a DAG of sub-questions, validated (acyclic, bounded, traced) before anything runs
  - pattern: fan_out_fan_in
    where: graph/run_graph.py · batch_start → research_node (Send per ready node) → batch_done
    notes: each batch's ready nodes run concurrently under the scheduler's cap and join at the batch boundary
  - pattern: react
    where: research/worker.py · research_node
    notes: a bounded act–observe loop per sub-question (search, fetch, read, follow up); next actions come from the plan and reflection, not free-form thoughts
  - pattern: agentic_retrieval
    where: research/worker.py + research/reflector.py
    notes: the agent chooses what to search next from what it has found (reflection's follow-up queries), within the budget
  - pattern: map_reduce
    where: research/extractor.py (map) · synthesis/synthesizer.py (reduce)
    notes: each fetched page maps to verbatim claims in the ledger; synthesis reduces the ledger to the report
  - pattern: reflection
    where: research/reflector.py · reflect_gap_analysis
    notes: after each batch, gaps against the rubric become follow-up nodes or a stop decision
  - pattern: evaluator_optimizer
    where: graph/run_nodes.py · synthesize → independent_audit → gap_fill → batch_start
    notes: an independent audit scores the report against the frozen rubric; must-pass gaps drive one bounded gap-fill round
  - pattern: orchestrator_subagent
    where: audit/independent.py · IndependentAuditor (agent_platform.durability.IsolatedGraphRunner)
    notes: the independent audit runs as an isolated sub-graph that receives only (contract, report, ledger_snapshot)
  - pattern: memory_systems
    where: archive/store.py · archive node
    notes: each run leaves an episodic index row and a semantic fact; working memory carries session status; procedural is disabled by design
other:
  - pattern: strategy
    where: research/stop_rules/ (one stop rule per archetype)
  - pattern: adapter
    where: agent_platform/web/providers.py · TavilyProvider and DuckDuckGoProvider behind SearchProvider
  - pattern: chain of responsibility
    where: agent_platform/web/router.py · SearchRouter (free provider first, metered fallback)
  - pattern: factory
    where: graph/builder.py (composition root)
  - pattern: builder
    where: scoping/brief.py · BriefBuilder
  - pattern: observer
    where: observability/telemetry.py (StageReporter + AuditLedger) · WebGateway observer
  - pattern: decorator
    where: research_agent/evals/agent_under_test.py · RecordingLLMClient around every role client
  - pattern: facade
    where: agent_platform MemoryFacade, used by archive/store.py
  - pattern: retry + idempotency + circuit breaker
    where: agent_platform/web/gateway.py · live search and fetch through ResilientCaller
  - pattern: bulkhead
    where: agent_platform/scheduling/scheduler.py · per-batch concurrency cap
