# Test-only overlay over the research agent's config: no network, no hosted model, no local
# model download. Models are injected per test (`build_agent(clients=...)`); the web is a
# replay store, so a search no test recorded raises instead of reaching the internet.
logging:
  run_label: tests

web:
  mode: replay

# The claim confirmer is a local checkpoint; tests inject a fake one where they need it.
hallucination_check:
  confirmer:
    enabled: false

research_agent:
  audit:
    entailment_model: lexical
